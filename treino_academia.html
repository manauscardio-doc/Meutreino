<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Meu Treino</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;--border:#2a2a2a;--border2:#333;--text:#f0f0f0;--text2:#999;--text3:#555;--blue:#4a9eff;--bdim:#1a3a5c;--green:#3ddc84;--gdim:#0d3320;--amber:#ffb347;--adim:#3d2800;--red:#ff5f57;--rdim:#3d1510;--purple:#b388ff;--pdim:#2a1a4a;--teal:#26c6a2;--tdim:#0a2e25}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100dvh;max-width:480px;margin:0 auto}
.screen{display:none;flex-direction:column;min-height:100dvh;padding-bottom:80px}
.screen.active{display:flex}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100}
.nb{flex:1;padding:10px 0 14px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif}
.nb.on{color:var(--blue)}
.nb svg{width:20px;height:20px;stroke-width:1.8}
.nl{font-size:9px;font-weight:500;letter-spacing:.04em}
/* HOME */
.hdr{padding:48px 20px 16px}
.hdr-greet{font-size:13px;color:var(--text3);font-family:'DM Mono',monospace;letter-spacing:.08em;margin-bottom:6px}
.hdr-title{font-size:26px;font-weight:300;letter-spacing:-.5px}
.hdr-title span{color:var(--blue);font-weight:600}
.week{display:flex;gap:6px;padding:0 20px 20px;overflow-x:auto;scrollbar-width:none}
.week::-webkit-scrollbar{display:none}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px}
.wd-lbl{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase}
.wd-dot{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--text3)}
.wd-dot.mu{border-color:var(--blue);color:var(--blue);background:var(--bdim)}
.wd-dot.co{border-color:var(--purple);color:var(--purple);background:var(--pdim)}
.wd-dot.ok{background:var(--green);border-color:var(--green);color:#000}
.wd-dot.td{box-shadow:0 0 0 2.5px var(--blue)}
.slbl{font-size:11px;font-family:'DM Mono',monospace;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:0 20px 8px}
.cards{display:flex;flex-direction:column;gap:10px;padding:0 20px 16px}
.dcard{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer}
.dcard.td{border-color:var(--bdim);background:linear-gradient(135deg,var(--bg2),#0d1e33)}
.dc-top{display:flex;justify-content:space-between;margin-bottom:8px}
.dc-dlbl{font-size:11px;font-family:'DM Mono',monospace;color:var(--text3);letter-spacing:.08em}
.badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:500}
.bf{background:var(--bdim);color:var(--blue)}
.bh{background:var(--gdim);color:var(--green)}
.bc{background:var(--adim);color:var(--amber)}
.bco{background:var(--pdim);color:var(--purple)}
.dc-name{font-size:18px;font-weight:500;margin-bottom:3px}
.dc-sub{font-size:12px;color:var(--text2)}
.dc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.dc-stats{display:flex;gap:12px}
.dc-s{font-size:11px;color:var(--text3)}
.dc-tag{font-size:10px;font-family:'DM Mono',monospace}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 20px 16px}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px}
.sc-n{font-size:24px;font-weight:600;font-family:'DM Mono',monospace}
.sc-l{font-size:11px;color:var(--text3);margin-top:2px}
/* WORKOUT */
.whdr{padding:16px 20px 0;display:flex;align-items:center;gap:12px}
.back{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.back svg{width:18px;height:18px;stroke:var(--text2)}
.wi{flex:1}
.wi-d{font-size:11px;font-family:'DM Mono',monospace;color:var(--text3);letter-spacing:.08em}
.wi-t{font-size:20px;font-weight:600;letter-spacing:-.3px}
.pbwrap{margin:14px 20px 0;background:var(--bg3);border-radius:4px;height:3px}
.pb{height:3px;border-radius:4px;background:var(--blue);transition:width .5s}
.plbl{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);padding:5px 20px 0}
.blist{padding:14px 20px;display:flex;flex-direction:column;gap:10px}
.bcard{background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.bcard.cur{border-color:var(--blue)}
.bcard.done{opacity:.5}
.bhdr{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.bhl{display:flex;align-items:center;gap:10px}
.bnum{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:'DM Mono',monospace;font-weight:500;flex-shrink:0}
.nw{background:var(--tdim);color:var(--teal)}
.ns{background:var(--bdim);color:var(--blue)}
.nh{background:var(--gdim);color:var(--green)}
.nc{background:var(--adim);color:var(--amber)}
.nco{background:var(--pdim);color:var(--purple)}
.ncl{background:var(--rdim);color:var(--red)}
.nca{background:var(--tdim);color:var(--teal)}
.bn{font-size:14px;font-weight:500}
.bm{font-size:11px;color:var(--text3);margin-top:2px}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.chk.on{background:var(--green);border-color:var(--green)}
.chk svg{width:12px;height:12px;stroke:#000;display:none}
.chk.on svg{display:block}
.bbody{display:none;border-top:1px solid var(--border)}
.bbody.open{display:block}
.exrow{padding:11px 16px;border-bottom:1px solid var(--border)}
.exrow:last-child{border-bottom:none}
.ext{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exn{font-size:13px;font-weight:500;flex:1}
.exs{font-size:12px;font-family:'DM Mono',monospace;color:var(--blue);white-space:nowrap}
.exd{font-size:11px;color:var(--text2);line-height:1.5;margin-top:2px}
.ext2{font-size:11px;color:var(--amber);font-family:'DM Mono',monospace;margin-top:2px}
.exw{font-size:11px;color:var(--red);margin-top:2px}
.extp{font-size:11px;color:var(--text3);margin-top:2px;font-style:italic}
.slabel,.dlabel,.solabel,.olabel{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:600;letter-spacing:.05em;margin-left:4px}
.slabel{background:var(--adim);color:var(--amber)}
.dlabel{background:var(--rdim);color:var(--red)}
.solabel{background:var(--bg4);color:var(--text3)}
.olabel{background:var(--tdim);color:var(--teal)}
.prow{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border2);flex-wrap:wrap}
.plb{font-size:11px;color:var(--text3);white-space:nowrap}
.pinput{background:var(--bg4);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;padding:6px 10px;width:80px;text-align:center}
.pinput:focus{outline:none;border-color:var(--blue)}
.psave{padding:6px 12px;border-radius:10px;background:var(--bdim);border:1px solid var(--blue);color:var(--blue);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer}
.plast{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace}
.tbtn{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:5px 12px;border-radius:20px;background:var(--pdim);border:1px solid var(--purple);color:var(--purple);font-size:11px;cursor:pointer}
.tbtn svg{width:12px;height:12px;stroke:currentColor;stroke-width:2}
.paurow{padding:10px 16px;background:var(--bg3);display:flex;align-items:center;justify-content:space-between}
.paui{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}
.stbtn{font-size:11px;font-family:'DM Mono',monospace;padding:6px 14px;border-radius:20px;background:var(--bg4);border:1px solid var(--border2);color:var(--text2);cursor:pointer}
.donebtn{margin:0 16px 12px;width:calc(100% - 32px);padding:13px;border-radius:10px;background:var(--bdim);border:1px solid var(--blue);color:var(--blue);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer}
.finbtn{margin:14px 20px 4px;padding:18px;border-radius:16px;background:var(--green);border:none;color:#000;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;display:none}
.fin2btn{margin:0 20px 20px;padding:13px;border-radius:16px;background:transparent;border:1px solid var(--border2);color:var(--text3);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}
/* TIMER */
.tov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:18px;max-width:480px;left:50%;transform:translateX(-50%)}
.tov.on{display:flex}
.tlbl{font-size:12px;font-family:'DM Mono',monospace;color:var(--text3);letter-spacing:.1em}
.tring{position:relative;width:200px;height:200px}
.tring svg{transform:rotate(-90deg)}
circle{fill:none;stroke-width:6}
.rbg{stroke:var(--bg3)}
.rfg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.tnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-family:'DM Mono',monospace;font-weight:500}
.tmsg{font-size:14px;color:var(--text2);text-align:center}
.tbtns{display:flex;gap:10px}
.tskip{padding:12px 32px;border-radius:30px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer}
.tadd{padding:12px 20px;border-radius:30px;background:transparent;border:1px solid var(--border);color:var(--text3);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}
/* EVO */
.evo-hdr{padding:48px 20px 16px}
.filter-row{display:flex;gap:6px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.fbtn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;white-space:nowrap}
.fbtn.on.fa{background:var(--bg3);border-color:var(--border2);color:var(--text)}
.fbtn.on.ff{background:var(--bdim);border-color:var(--blue);color:var(--blue)}
.fbtn.on.fh{background:var(--gdim);border-color:var(--green);color:var(--green)}
.fbtn.on.fc{background:var(--adim);border-color:var(--amber);color:var(--amber)}
.period-row{display:flex;gap:6px;padding:0 20px 16px}
.pbtn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer}
.pbtn.on{background:var(--bg3);border-color:var(--border2);color:var(--text2)}
.ccrd{background:var(--bg2);border:1px solid var(--border);border-radius:16px;margin:0 20px 12px;padding:14px 16px;overflow:hidden}
.ct{font-size:13px;font-weight:500;margin-bottom:4px}
.cs{font-size:11px;color:var(--text3);margin-bottom:12px}
.cwrap{position:relative;height:120px;width:100%}
canvas{width:100%!important;height:120px!important}
.cdelta{font-size:11px;font-family:'DM Mono',monospace;margin-top:8px}
.up{color:var(--green)}.dn{color:var(--red)}.eq{color:var(--text3)}
.evo-empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px;line-height:1.8}
/* HIST */
.hist-hdr{padding:48px 20px 16px}
.hlist{padding:0 20px;display:flex;flex-direction:column;gap:8px}
.hi{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:13px 15px}
.hi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.hi-n{font-size:14px;font-weight:500}
.hi-d{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3)}
.hi-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.hi-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.hi-dur{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}
/* REL */
.rel-hdr{padding:48px 20px 16px}
.rsec{padding:0 20px;display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.ebtn{padding:14px;border-radius:16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
/* COMPLETE */
#cscreen{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 30px;max-width:480px;left:50%;transform:translateX(-50%)}
</style>
</head>
<body>

<div class="screen active" id="s-home">
  <div class="hdr">
    <div class="hdr-greet" id="greet">BOM DIA</div>
    <div class="hdr-title">Seu treino<br><span id="today-lbl">de hoje</span></div>
  </div>
  <div class="week" id="week"></div>
  <div class="slbl">SESSOES DA SEMANA</div>
  <div class="cards" id="cards"></div>
  <div class="slbl">RESUMO</div>
  <div class="srow" id="srow"></div>
</div>

<div class="screen" id="s-workout">
  <div class="whdr">
    <div class="back" onclick="goHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></div>
    <div class="wi"><div class="wi-d" id="wd-lbl"></div><div class="wi-t" id="wd-title"></div></div>
  </div>
  <div class="pbwrap"><div class="pb" id="pb" style="width:0%"></div></div>
  <div class="plbl" id="plbl">0 de 0 blocos</div>
  <div class="blist" id="blist"></div>
  <button class="finbtn" id="finbtn" onclick="finishWorkout()">Concluir treino</button>
  <button class="fin2btn" onclick="finishEarly()">Finalizar agora (incompleto)</button>
</div>

<div class="screen" id="s-evo">
  <div class="evo-hdr">
    <div class="hdr-greet">GRAFICOS</div>
    <div class="hdr-title" style="font-size:24px">Evolucao<br><span style="color:var(--amber);font-weight:600">de cargas</span></div>
  </div>
  <div class="filter-row" id="efilter"></div>
  <div class="period-row" id="eperiod"></div>
  <div id="echarts"></div>
</div>

<div class="screen" id="s-history">
  <div class="hist-hdr">
    <div class="hdr-greet">REGISTRO</div>
    <div class="hdr-title" style="font-size:24px">Treinos<br><span style="color:var(--green);font-weight:600">realizados</span></div>
  </div>
  <div class="srow" id="hstats"></div>
  <div class="slbl">HISTORICO</div>
  <div id="hcontent"></div>
</div>

<div class="screen" id="s-rel">
  <div class="rel-hdr">
    <div class="hdr-greet">EXPORTAR</div>
    <div class="hdr-title" style="font-size:24px">Relatorio<br><span style="color:var(--purple);font-weight:600">e backup</span></div>
  </div>
  <div class="rsec">
    <button class="ebtn" style="background:var(--purple);color:#fff" onclick="exportPDF()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      Exportar relatorio PDF
    </button>
    <button class="ebtn" style="background:var(--bdim);border:1px solid var(--blue);color:var(--blue)" onclick="copyForClaude()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Copiar dados para Claude
    </button>
    <button class="ebtn" style="background:var(--bg2);border:1px solid var(--green);color:var(--green)" onclick="exportJSON()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Backup JSON
    </button>
    <button class="ebtn" style="background:var(--bg2);border:1px solid var(--border2);color:var(--text2)" onclick="document.getElementById('impf').click()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Importar backup JSON
    </button>
    <input type="file" id="impf" accept=".json" style="display:none" onchange="importData(event)">
    <button class="ebtn" style="background:transparent;border:1px solid var(--border);color:var(--text3)" onclick="clearData()">Limpar todos os dados</button>
  </div>
  <div class="slbl">PRE-VISUALIZACAO</div>
  <div class="rsec" id="rpreview"></div>
</div>

<nav>
  <button class="nb on" id="nb-home" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    <span class="nl">HOJE</span>
  </button>
  <button class="nb" id="nb-evo" onclick="switchTab('evo')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
    <span class="nl">EVOLUCAO</span>
  </button>
  <button class="nb" id="nb-history" onclick="switchTab('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
    <span class="nl">HISTORICO</span>
  </button>
  <button class="nb" id="nb-rel" onclick="switchTab('rel')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
    <span class="nl">RELATORIO</span>
  </button>
</nav>

<div class="tov" id="tov">
  <div class="tlbl" id="tlbl">DESCANSO</div>
  <div class="tring">
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle class="rbg" cx="100" cy="100" r="88"/>
      <circle class="rfg" id="rfg" cx="100" cy="100" r="88" stroke-dasharray="553" stroke-dashoffset="0"/>
    </svg>
    <div class="tnum" id="tnum">90</div>
  </div>
  <div class="tmsg" id="tmsg">Proxima serie em breve</div>
  <div class="tbtns">
    <button class="tadd" onclick="addTime(30)">+30s</button>
    <button class="tskip" onclick="skipTimer()">Pular</button>
  </div>
</div>

<div id="cscreen">
  <div style="width:80px;height:80px;border-radius:50%;background:var(--gdim);border:2px solid var(--green);display:flex;align-items:center;justify-content:center">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><polyline points="20,6 9,17 4,12"/></svg>
  </div>
  <div id="c-title" style="font-size:26px;font-weight:300;letter-spacing:-.5px;text-align:center"></div>
  <div id="c-sub" style="font-size:13px;color:var(--text2);text-align:center;line-height:1.6"></div>
  <div id="c-tags" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center"></div>
  <button onclick="goHome()" style="width:100%;padding:16px;border-radius:16px;background:var(--green);border:none;color:#000;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px">Voltar ao inicio</button>
</div>

<script>
var WS = [
{id:'seg',day:'Segunda-feira',sd:'SEG',type:'Forca',badge:'bf',reps:'4-6 reps',dur:'~45 min',mus:['Peito','Costas','Biceps','Triceps','Posterior','Quadriceps'],
 blocks:[

var ACX=null;

function getH(){try{return JSON.parse(localStorage.getItem('wh')||'[]')}catch(e){return[]}}
function saveH(h){localStorage.setItem('wh',JSON.stringify(h))}
function getW(){try{return JSON.parse(localStorage.getItem('ww')||'{}')}catch(e){return{}}}
function saveW2(w){localStorage.setItem('ww',JSON.stringify(w))}
function wk(wid,bid,n){return wid+'__'+bid+'__'+n.replace(/[^a-z0-9]/gi,'_')}
function getLastW(wid,bid,n){var a=getW(),k=wk(wid,bid,n),e=a[k]||[];return e.length?e[e.length-1]:null}
function saveWEntry(wid,bid,n,v){var a=getW(),k=wk(wid,bid,n);if(!a[k])a[k]=[];a[k].push({date:new Date().toISOString(),peso:v});if(a[k].length>30)a[k]=a[k].slice(-30);saveW2(a)}

function beep(f,dur,vol,delay){
  if(!ACX)try{ACX=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  try{var o=ACX.createOscillator(),g=ACX.createGain();o.connect(g);g.connect(ACX.destination);
    o.frequency.value=f;o.type='sine';var t=ACX.currentTime+(delay||0);
    g.gain.setValueAtTime(vol||0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start(t);o.stop(t+dur+0.05)}catch(e){}
}
function playEnd(){beep(880,0.12,0.4,0);beep(880,0.12,0.4,0.18);beep(1320,0.25,0.5,0.36)}

function init(){
  var h=new Date().getHours();
  document.getElementById('greet').textContent=h<12?'BOM DIA':h<18?'BOA TARDE':'BOA NOITE';
  var dow=new Date().getDay(),wid=SCHED[dow];
  var w=wid?WS.find(function(x){return x.id===wid}):null;
  document.getElementById('today-lbl').textContent=w?w.type.toLowerCase():'de descanso';
  renderWeek();renderCards();renderStats();
}

function renderWeek(){
  var today=new Date().getDay(),hist=getH(),done={};
  hist.forEach(function(h){done[h.wid]=true});
  var days=[1,2,3,4,5,6,0],labels=['SEG','TER','QUA','QUI','SEX','SAB','DOM'];
  document.getElementById('week').innerHTML=days.map(function(d,i){
    var wid=SCHED[d],w=wid?WS.find(function(x){return x.id===wid}):null;
    var isToday=d===today;
    var cls=wid?(w&&(w.id==='ter'||w.id==='qui')?'co':'mu'):'';
    if(wid&&done[wid])cls='ok';
    if(isToday)cls+=' td';
    return '<div class="wd"><div class="wd-lbl">'+labels[i]+'</div><div class="wd-dot '+cls+'">'+(cls.indexOf('ok')>=0?'v':(w?w.sd.charAt(0):'-'))+'</div></div>';
  }).join('');
}

function renderCards(){
  var today=new Date().getDay(),hist=getH(),done={};
  hist.forEach(function(h){done[h.wid]=true});
  document.getElementById('cards').innerHTML=WS.map(function(w){
    var isToday=SCHED[today]===w.id,isDone=done[w.id];
    return '<div class="dcard'+(isToday?' td':'')+'" onclick="startW(\''+w.id+'\')">'+
      '<div class="dc-top"><div class="dc-dlbl">'+w.day.toUpperCase()+'</div><div class="badge '+w.badge+'">'+w.type.toUpperCase()+'</div></div>'+
      '<div class="dc-name">'+w.type+'</div><div class="dc-sub">'+w.mus.slice(0,4).join(' - ')+'</div>'+
      '<div class="dc-foot"><div class="dc-stats">'+
      '<div class="dc-s">'+w.dur+'</div><div class="dc-s">'+w.reps+'</div></div>'+
      (isDone?'<div class="dc-tag" style="color:var(--green)">feito esta semana</div>':(isToday?'<div class="dc-tag" style="color:var(--amber)">hoje</div>':''))+'</div></div>';
  }).join('');
}

function renderStats(){
  var hist=getH(),now=new Date(),sow=new Date(now);
  sow.setDate(now.getDate()-now.getDay());sow.setHours(0,0,0,0);
  var tw=hist.filter(function(h){return new Date(h.date)>=sow});
  document.getElementById('srow').innerHTML=
    '<div class="sc"><div class="sc-n" style="color:var(--blue)">'+tw.length+'</div><div class="sc-l">treinos esta semana</div></div>'+
    '<div class="sc"><div class="sc-n" style="color:var(--green)">'+hist.length+'</div><div class="sc-l">treinos no total</div></div>';
}

function startW(id){
  CW=WS.find(function(w){return w.id===id});DB=new Set();
  document.getElementById('wd-lbl').textContent=CW.day.toUpperCase();
  document.getElementById('wd-title').textContent=CW.type;
  renderBlocks();updateProg();
  document.getElementById('finbtn').style.display='none';
  switchTab('workout');
}

function bnClass(t){return{w:'nw',s:'ns',h:'nh',co:'nc',c:'ncl',ca:'nca'}[t]||'ns'}

function renderBlocks(){
  var list=document.getElementById('blist');if(!CW)return;
  var showPeso=function(t){return t!=='w'&&t!=='c'};
  list.innerHTML=CW.blocks.map(function(bl,i){
    var bnC=bnClass(bl.t);
    var tagH=bl.tag==='S'?'<span class="slabel">SUPERSET</span>':bl.tag==='D'?'<span class="dlabel">DROPSET</span>':bl.tag==='O'?'<span class="olabel">OPCIONAL</span>':'';
    var exH=bl.ex.map(function(ex){
      var last=getLastW(CW.id,bl.id,ex.n);
      var cid=bl.id+'-'+ex.n.replace(/[^a-z0-9]/gi,'_');
      var tbH=ex.ts?'<button class="tbtn" onclick="startExT('+ex.ts+',event)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>'+ex.ts+'s</button>':'';
      var pH=showPeso(bl.t)?'<div class="prow"><span class="plb">Peso:</span><input class="pinput" type="number" inputmode="decimal" placeholder="kg" id="pi-'+cid+'"'+(last?' value="'+last.peso+'"':'')+'/><button class="psave" onclick="savePeso(\''+bl.id+'\',\''+ex.n.replace(/'/g,'').replace(/"/g,'')+'\',event)">Salvar</button>'+(last?'<span class="plast">ult: '+last.peso+'kg</span>':'')+'</div>':'';
      return '<div class="exrow">'+
        '<div class="ext"><div class="exn">'+ex.n+'</div><div class="exs">'+ex.s+'</div></div>'+
        (ex.d?'<div class="exd">'+ex.d+'</div>':'')+
        (ex.ti?'<div class="ext2">'+ex.ti+'</div>':'')+
        (ex.w?'<div class="exw">&#9888; '+ex.w+'</div>':'')+
        (ex.tp?'<div class="extp">'+ex.tp+'</div>':'')+
        tbH+pH+'</div>';
    }).join('');
    var prH=bl.rest>0?'<div class="paurow"><div class="paui">'+bl.rl+'</div><button class="stbtn" onclick="startRestT('+bl.rest+',event)">Iniciar</button></div>':'';
    return '<div class="bcard" id="bc-'+bl.id+'">'+
      '<div class="bhdr" onclick="toggleBl(\''+bl.id+'\')">'+
      '<div class="bhl"><div class="bnum '+bnC+'">'+(i+1)+'</div>'+
      '<div><div class="bn">'+bl.n+tagH+'</div><div class="bm">'+bl.time+'</div></div></div>'+
      '<div class="chk" id="chk-'+bl.id+'" onclick="toggleDone(\''+bl.id+'\',event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20,6 9,17 4,12"/></svg></div>'+
      '</div>'+
      '<div class="bbody" id="bb-'+bl.id+'">'+exH+prH+
      '<button class="donebtn" onclick="markDone(\''+bl.id+'\')">Marcar como feito</button></div></div>';
  }).join('');
  if(CW.blocks.length>0)document.getElementById('bb-'+CW.blocks[0].id).classList.add('open');
}

function savePeso(bid,exName,e){
  e.stopPropagation();
  var cid=bid+'-'+exName.replace(/[^a-z0-9]/gi,'_');
  var inp=document.getElementById('pi-'+cid);
  if(!inp||!inp.value)return;
  var v=parseFloat(inp.value);if(isNaN(v))return;
  saveWEntry(CW.id,bid,exName,v);
  inp.style.borderColor='var(--green)';
  setTimeout(function(){inp.style.borderColor=''},1200);
  var sp=inp.parentElement.querySelector('.plast');
  if(sp)sp.textContent='ult: '+v+'kg';
  else{var s=document.createElement('span');s.className='plast';s.textContent='ult: '+v+'kg';inp.parentElement.appendChild(s)}
}

function startExT(s,e){if(e)e.stopPropagation();startRestT(s,null,true)}

function toggleBl(id){
  var b=document.getElementById('bb-'+id),open=b.classList.contains('open');
  document.querySelectorAll('.bbody').forEach(function(x){x.classList.remove('open')});
  if(!open)b.classList.add('open');
}

function markDone(id){
  DB.add(id);
  document.getElementById('bc-'+id).classList.add('done');
  document.getElementById('chk-'+id).classList.add('on');
  document.getElementById('bb-'+id).classList.remove('open');
  updateProg();
  var idx=CW.blocks.findIndex(function(b){return b.id===id});
  if(idx<CW.blocks.length-1){
    var nid=CW.blocks[idx+1].id;
    document.getElementById('bc-'+nid).classList.add('cur');
    document.getElementById('bb-'+nid).classList.add('open');
    document.getElementById('bc-'+nid).scrollIntoView({behavior:'smooth',block:'start'});
  }
  if(DB.size===CW.blocks.length){
    var fb=document.getElementById('finbtn');fb.style.display='block';
    fb.scrollIntoView({behavior:'smooth'});
  }
}

function toggleDone(id,e){
  e.stopPropagation();
  if(DB.has(id)){DB.delete(id);document.getElementById('bc-'+id).classList.remove('done');document.getElementById('chk-'+id).classList.remove('on')}
  else markDone(id);
  updateProg();
}

function updateProg(){
  if(!CW)return;
  var t=CW.blocks.length,d=DB.size;
  document.getElementById('pb').style.width=Math.round(d/t*100)+'%';
  document.getElementById('plbl').textContent=d+' de '+t+' blocos concluidos';
}

function finishWorkout(){saveRec(true)}
function finishEarly(){if(DB.size===0&&!confirm('Nenhum bloco. Finalizar?'))return;saveRec(false)}

function saveRec(complete){
  var hist=getH();
  hist.unshift({wid:CW.id,wtype:CW.type,day:CW.day,mus:CW.mus,date:new Date().toISOString(),dur:CW.dur,complete:complete,bc:DB.size,bt:CW.blocks.length});
  saveH(hist);
  document.getElementById('c-title').innerHTML=complete?'Treino<br><span style="color:var(--green);font-weight:600">concluido!</span>':'Treino<br><span style="color:var(--amber);font-weight:600">finalizado!</span>';
  document.getElementById('c-sub').textContent=CW.day+' - '+CW.type+' - '+DB.size+'/'+CW.blocks.length+' blocos';
  document.getElementById('c-tags').innerHTML=CW.mus.map(function(m){return'<span style="font-size:11px;padding:4px 11px;border-radius:20px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2)">'+m+'</span>'}).join('');
  document.getElementById('cscreen').style.display='flex';
}

function goHome(){
  document.getElementById('cscreen').style.display='none';
  CW=null;DB=new Set();renderWeek();renderCards();renderStats();switchTab('home');
}

function startRestT(seconds,e,isEx){
  if(e)e.stopPropagation();
  TSL=seconds;TTO=seconds;
  document.getElementById('tlbl').textContent=isEx?'EXERCICIO':'DESCANSO';
  document.getElementById('tmsg').textContent=isEx?'Mantenha a posicao':'Proxima serie em breve';
  document.getElementById('tov').classList.add('on');
  updateTUI();clearInterval(TI);
  TI=setInterval(function(){
    TSL--;updateTUI();
    if(TSL<=0){
      clearInterval(TI);
      document.getElementById('tov').classList.remove('on');
      if('vibrate' in navigator)navigator.vibrate([200,100,200,100,200]);
      playEnd();
    }
  },1000);
}

function updateTUI(){
  document.getElementById('tnum').textContent=TSL;
  var p=TSL/TTO,c=553*(1-p),col=TSL>TTO*.5?'#4a9eff':TSL>TTO*.25?'#ffb347':'#ff5f57';
  document.getElementById('rfg').style.strokeDashoffset=c;
  document.getElementById('rfg').style.stroke=col;
}

function skipTimer(){clearInterval(TI);document.getElementById('tov').classList.remove('on')}
function addTime(s){TSL+=s;TTO+=s;updateTUI()}

var CCOLS=['#4a9eff','#3ddc84','#ffb347','#b388ff','#26c6a2','#ff5f57'];

function getExs(){
  var typeMap={seg:'Forca',qua:'Hipertrofia',sex:'Complementar'};
  return WS.filter(function(w){
    if(EF==='all')return w.id!=='ter'&&w.id!=='qui';
    if(EF==='Forca')return w.id==='seg';
    if(EF==='Hipertrofia')return w.id==='qua';
    if(EF==='Complementar')return w.id==='sex';
    return false;
  }).reduce(function(acc,w){
    w.blocks.forEach(function(b){
      if(['w','c','ca'].indexOf(b.t)>=0)return;
      b.ex.forEach(function(ex){acc.push({wid:w.id,bid:b.id,name:ex.n,wday:w.sd,wtype:typeMap[w.id]||w.type})});
    });
    return acc;
  },[]);
}

function getEntries(wid,bid,n){
  var a=getW(),k=wk(wid,bid,n),e=a[k]||[],cut=new Date();
  cut.setDate(cut.getDate()-EP);
  return EP===999?e:e.filter(function(x){return new Date(x.date)>=cut});
}

function renderEvo(){
  var fs=[{id:'all',l:'Todos',c:'fa'},{id:'Forca',l:'Forca',c:'ff'},{id:'Hipertrofia',l:'Hipertrofia',c:'fh'},{id:'Complementar',l:'Complementar',c:'fc'}];
  document.getElementById('efilter').innerHTML=fs.map(function(f){return'<button class="fbtn '+(EF===f.id?'on ':'')+f.c+'" onclick="setEF(\''+f.id+'\')">'+f.l+'</button>'}).join('');
  var ps=[{v:14,l:'2 sem'},{v:30,l:'1 mes'},{v:90,l:'3 meses'},{v:999,l:'Tudo'}];
  document.getElementById('eperiod').innerHTML=ps.map(function(p){return'<button class="pbtn'+(EP===p.v?' on':'')+'" onclick="setEP('+p.v+')">'+p.l+'</button>'}).join('');
  var exs=getExs(),ct=document.getElementById('echarts'),html='',hasData=false,idx=0;
  exs.forEach(function(ex){
    var entries=getEntries(ex.wid,ex.bid,ex.name);if(entries.length<1)return;
    hasData=true;
    var f=entries[0].peso,l=entries[entries.length-1].peso,d=l-f;
    var ds=d>0?'+'+d.toFixed(1)+'kg':d<0?d.toFixed(1)+'kg':'=';
    var dc=d>0?'up':d<0?'dn':'eq';
    var sn=ex.name.length>40?ex.name.substring(0,38)+'...':ex.name;
    html+='<div class="ccrd"><div class="ct">'+sn+'</div><div class="cs">'+ex.wday+' - '+ex.wtype+' - '+entries.length+' registro(s)</div><div class="cwrap"><canvas id="cv-'+idx+'" width="400" height="120"></canvas></div><div class="cdelta '+dc+'">'+(entries.length>1?'Variacao: '+ds+' ('+f+'kg -> '+l+'kg)':'Ultimo: '+l+'kg')+'</div></div>';
    idx++;
  });
  if(!hasData)html='<div class="evo-empty">Nenhum peso registrado ainda.<br>Complete uma sessao e salve os pesos.</div>';
  ct.innerHTML=html;
  if(hasData)requestAnimationFrame(function(){
    var i2=0;
    exs.forEach(function(ex){
      var entries=getEntries(ex.wid,ex.bid,ex.name);if(entries.length<1)return;
      var cv=document.getElementById('cv-'+i2);if(cv)drawChart(cv,entries,CCOLS[i2%CCOLS.length]);
      i2++;
    });
  });
}

function drawChart(cv,entries,col){
  var ctx=cv.getContext('2d'),W=cv.offsetWidth||340,H=120;
  cv.width=W*(window.devicePixelRatio||1);cv.height=H*(window.devicePixelRatio||1);
  ctx.scale(window.devicePixelRatio||1,window.devicePixelRatio||1);
  var vals=entries.map(function(e){return e.peso}),mn=Math.min.apply(null,vals)*.95,mx=Math.max.apply(null,vals)*1.05;
  var p={t:10,r:10,b:24,l:36},cW=W-p.l-p.r,cH=H-p.t-p.b;
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;
  for(var i=0;i<=4;i++){var y=p.t+cH*(1-i/4);ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(p.l+cW,y);ctx.stroke()}
  ctx.fillStyle='#555';ctx.font='9px DM Mono,monospace';ctx.textAlign='right';
  for(var i=0;i<=4;i++){var v=mn+(mx-mn)*i/4,y=p.t+cH*(1-i/4);ctx.fillText(v.toFixed(1),p.l-4,y+3)}
  ctx.textAlign='center';ctx.fillStyle='#555';
  if(entries.length>1){var step=Math.max(1,Math.floor(entries.length/4));for(var i=0;i<entries.length;i+=step){var x=p.l+cW*i/(entries.length-1),d=new Date(entries[i].date);ctx.fillText(d.getDate()+'/'+(d.getMonth()+1),x,H-6)}}
  if(entries.length>1){
    var g=ctx.createLinearGradient(0,p.t,0,p.t+cH);g.addColorStop(0,col+'44');g.addColorStop(1,col+'00');
    ctx.beginPath();entries.forEach(function(e,i){var x=p.l+cW*i/(entries.length-1),y=p.t+cH*(1-(e.peso-mn)/(mx-mn));i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
    ctx.lineTo(p.l+cW,p.t+cH);ctx.lineTo(p.l,p.t+cH);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  }
  ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineJoin='round';
  entries.forEach(function(e,i){var x=p.l+cW*i/Math.max(entries.length-1,1),y=p.t+cH*(1-(e.peso-mn)/(mx-mn));i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.stroke();
  entries.forEach(function(e,i){var x=p.l+cW*i/Math.max(entries.length-1,1),y=p.t+cH*(1-(e.peso-mn)/(mx-mn));ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fillStyle='#0a0a0a';ctx.fill()});
}

function setEF(f){EF=f;renderEvo()}
function setEP(p){EP=p;renderEvo()}

function renderHistory(){
  var hist=getH(),now=new Date(),sow=new Date(now);
  sow.setDate(now.getDate()-now.getDay());sow.setHours(0,0,0,0);
  var tw=hist.filter(function(h){return new Date(h.date)>=sow});
  var allM={};hist.forEach(function(h){(h.mus||[]).forEach(function(m){allM[m]=(allM[m]||0)+1})});
  var topM=Object.entries(allM).sort(function(a,b){return b[1]-a[1]})[0];
  document.getElementById('hstats').innerHTML=
    '<div class="sc"><div class="sc-n" style="color:var(--blue)">'+tw.length+'</div><div class="sc-l">esta semana</div></div>'+
    '<div class="sc"><div class="sc-n" style="color:var(--green)">'+hist.length+'</div><div class="sc-l">total</div></div>'+
    '<div class="sc"><div class="sc-n" style="color:var(--amber)">'+Math.floor(hist.length*40)+'</div><div class="sc-l">min treinados</div></div>'+
    '<div class="sc"><div class="sc-n" style="color:var(--purple);font-size:13px;padding-top:6px">'+(topM?topM[0]:'--')+'</div><div class="sc-l">grupo top</div></div>';
  var c=document.getElementById('hcontent');
  if(!hist.length){c.innerHTML='<div style="padding:40px 20px;text-align:center;color:var(--text3)">Nenhum treino ainda.</div>';return}
  c.innerHTML='<div class="hlist">'+hist.map(function(h){
    var d=new Date(h.date),ds=d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'}),ts=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    var badge=h.complete===false?' <span style="font-size:10px;color:var(--amber)">('+( h.bc||0)+'/'+(h.bt||0)+')</span>':'';
    return '<div class="hi"><div class="hi-top"><div class="hi-n">'+(h.wtype||h.type||'?')+badge+'</div><div class="hi-d">'+ds+' '+ts+'</div></div>'+
      '<div class="hi-tags">'+((h.mus||[])).map(function(m){return'<span class="hi-tag">'+m+'</span>'}).join('')+'</div>'+
      '<div class="hi-dur">'+(h.dur||'')+'</div></div>';
  }).join('')+'</div>';
}

function buildReport(){
  var all=getW(),hist=getH(),tables=[];
  WS.filter(function(w){return w.id!=='ter'&&w.id!=='qui'}).forEach(function(w){
    var rows=[];
    w.blocks.forEach(function(b){
      if(['w','c','ca'].indexOf(b.t)>=0)return;
      b.ex.forEach(function(ex){
        var k=wk(w.id,b.id,ex.n),e=all[k]||[];if(!e.length)return;
        var f=e[0],l=e[e.length-1],d=l.peso-f.peso;
        rows.push({name:ex.n,n:e.length,ini:f.peso,cur:l.peso,d:d,di:new Date(f.date).toLocaleDateString('pt-BR'),dc:new Date(l.date).toLocaleDateString('pt-BR')});
      });
    });
    if(rows.length)tables.push({wt:w.type,day:w.day,rows:rows});
  });
  return{tables:tables,hist:hist,gen:new Date().toLocaleString('pt-BR')};
}

function renderRelPreview(){
  var data=buildReport(),html='';
  if(!data.tables.length){document.getElementById('rpreview').innerHTML='<div style="padding:20px;color:var(--text3);font-size:13px;text-align:center">Nenhum dado ainda. Registre pesos durante os treinos.</div>';return}
  data.tables.forEach(function(t){
    html+='<div style="background:var(--bg2);border:.5px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px">'+
      '<div style="font-size:13px;font-weight:500;margin-bottom:10px">'+t.wt+'</div>'+
      '<table style="width:100%;border-collapse:collapse;font-size:11px">'+
      '<thead><tr><th style="text-align:left;padding:4px 6px;color:var(--text3);border-bottom:1px solid var(--border)">Exercicio</th><th style="padding:4px 6px;color:var(--text3);border-bottom:1px solid var(--border)">Inicio</th><th style="padding:4px 6px;color:var(--text3);border-bottom:1px solid var(--border)">Atual</th><th style="padding:4px 6px;color:var(--text3);border-bottom:1px solid var(--border)">Delta</th></tr></thead><tbody>'+
      t.rows.map(function(r){var dc=r.d>0?'color:var(--green)':r.d<0?'color:var(--red)':'color:var(--text3)';return'<tr><td style="padding:5px 6px;border-bottom:1px solid var(--border);color:var(--text2)">'+(r.name.length>26?r.name.substring(0,24)+'...':r.name)+'</td><td style="padding:5px 6px;border-bottom:1px solid var(--border);text-align:center">'+r.ini+'kg</td><td style="padding:5px 6px;border-bottom:1px solid var(--border);text-align:center">'+r.cur+'kg</td><td style="padding:5px 6px;border-bottom:1px solid var(--border);text-align:center;'+dc+'">'+(r.d>0?'+':'')+r.d.toFixed(1)+'kg</td></tr>'}).join('')+
      '</tbody></table></div>';
  });
  document.getElementById('rpreview').innerHTML=html;
}

function exportPDF(){
  var data=buildReport(),body='<h1 style="font-family:sans-serif;font-size:22px;margin-bottom:4px">Relatorio de Progressao</h1><p style="font-family:sans-serif;font-size:12px;color:#888;margin-bottom:24px">Gerado em '+data.gen+'</p>';
  data.tables.forEach(function(t){
    body+='<h2 style="font-family:sans-serif;font-size:15px;margin-bottom:8px;margin-top:20px">'+t.wt+'</h2><table style="width:100%;border-collapse:collapse;font-family:sans-serif;font-size:11px;margin-bottom:16px"><thead><tr style="background:#f5f5f5"><th style="text-align:left;padding:6px 8px;border:1px solid #ddd">Exercicio</th><th style="padding:6px 8px;border:1px solid #ddd">Inicio</th><th style="padding:6px 8px;border:1px solid #ddd">Atual</th><th style="padding:6px 8px;border:1px solid #ddd">Delta</th></tr></thead><tbody>'+
    t.rows.map(function(r){return'<tr><td style="padding:5px 8px;border:1px solid #eee">'+r.name+'</td><td style="padding:5px 8px;border:1px solid #eee;text-align:center">'+r.ini+'kg ('+r.di+')</td><td style="padding:5px 8px;border:1px solid #eee;text-align:center">'+r.cur+'kg ('+r.dc+')</td><td style="padding:5px 8px;border:1px solid #eee;text-align:center;color:'+(r.d>0?'green':r.d<0?'red':'#888')+';">'+(r.d>0?'+':'')+r.d.toFixed(1)+'kg</td></tr>'}).join('')+'</tbody></table>';
  });
  var win=window.open('','_blank');
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Relatorio</title><style>@media print{button{display:none}}body{margin:24px;color:#111}</style></head><body><div style="text-align:right;margin-bottom:16px"><button onclick="window.print()" style="padding:10px 20px;background:#4a9eff;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">Salvar PDF (Ctrl+P)</button></div>'+body+'</body></html>');
  win.document.close();
}

function exportJSON(){
  var blob=new Blob([JSON.stringify({history:getH(),weights:getW(),exportDate:new Date().toISOString(),version:3},null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='treino-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);
}

function importData(e){
  var file=e.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{var d=JSON.parse(ev.target.result);if(d.history)saveH(d.history);if(d.weights)saveW2(d.weights);alert('Importado!');renderWeek();renderCards();renderStats()}
    catch(err){alert('Arquivo invalido.')}
  };r.readAsText(file);e.target.value='';
}

function clearData(){if(confirm('Apagar TUDO?')){localStorage.removeItem('wh');localStorage.removeItem('ww');alert('Apagado.');renderWeek();renderCards();renderStats()}}

function copyForClaude(){
  var d=buildReport(),txt='PROGRESSAO - '+d.gen+'\n\n';
  d.tables.forEach(function(t){
    txt+=t.wt+'\n';
    t.rows.forEach(function(r){txt+=r.name+': '+r.ini+'kg ('+r.di+') -> '+r.cur+'kg ('+r.dc+') delta '+(r.d>0?'+':'')+r.d.toFixed(1)+'kg | '+r.n+' registros\n'});
    txt+='\n';
  });
  txt+='HISTORICO\n';
  d.hist.forEach(function(h){txt+=new Date(h.date).toLocaleDateString('pt-BR')+' - '+(h.wtype||'?')+' ('+(h.bc||'?')+'/'+(h.bt||'?')+')\n'});
  try{navigator.clipboard.writeText(txt).then(function(){alert('Copiado! Cole no Claude.')})}
  catch(e){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('Copiado!')}
}

function switchTab(tab){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('on')});
  var nav=document.querySelector('nav');nav.style.display='flex';
  if(tab==='home'){document.getElementById('s-home').classList.add('active');document.getElementById('nb-home').classList.add('on')}
  else if(tab==='evo'){document.getElementById('s-evo').classList.add('active');document.getElementById('nb-evo').classList.add('on');renderEvo()}
  else if(tab==='history'){document.getElementById('s-history').classList.add('active');document.getElementById('nb-history').classList.add('on');renderHistory()}
  else if(tab==='rel'){document.getElementById('s-rel').classList.add('active');document.getElementById('nb-rel').classList.add('on');renderRelPreview()}
  else if(tab==='workout'){document.getElementById('s-workout').classList.add('active');nav.style.display='none';window.scrollTo(0,0)}
}

init();
