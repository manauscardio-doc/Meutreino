<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Treino</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --bg2: #111111;
  --bg3: #1a1a1a;
  --bg4: #222222;
  --border: #2a2a2a;
  --border2: #333333;
  --text: #f0f0f0;
  --text2: #999999;
  --text3: #555555;
  --blue: #4a9eff;
  --blue-dim: #1a3a5c;
  --green: #3ddc84;
  --green-dim: #0d3320;
  --amber: #ffb347;
  --amber-dim: #3d2800;
  --red: #ff5f57;
  --red-dim: #3d1510;
  --purple: #b388ff;
  --purple-dim: #2a1a4a;
  --teal: #26c6a2;
  --teal-dim: #0a2e25;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --r: 10px;
  --r2: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overscroll-behavior: none; }
body { display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; min-height: 100dvh; }

/* SCREENS */
.screen { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 80px; }
.screen.active { display: flex; }

/* NAV */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--bg2); border-top: 1px solid var(--border); display: flex; z-index: 100; }
.nav-btn { flex: 1; padding: 12px 0 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--text3); cursor: pointer; transition: color .2s; font-family: var(--sans); }
.nav-btn.active { color: var(--blue); }
.nav-btn svg { width: 22px; height: 22px; stroke-width: 1.8; }
.nav-label { font-size: 10px; font-weight: 500; letter-spacing: .04em; }

/* HOME */
.home-header { padding: 48px 20px 24px; }
.home-greeting { font-size: 13px; color: var(--text3); font-family: var(--mono); letter-spacing: .08em; margin-bottom: 6px; }
.home-title { font-size: 28px; font-weight: 300; letter-spacing: -.5px; line-height: 1.2; }
.home-title span { color: var(--blue); font-weight: 600; }
.week-strip { display: flex; gap: 6px; padding: 0 20px 24px; overflow-x: auto; scrollbar-width: none; }
.week-strip::-webkit-scrollbar { display: none; }
.week-day { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 44px; }
.wd-label { font-size: 10px; color: var(--text3); font-family: var(--mono); text-transform: uppercase; }
.wd-dot { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--text3); transition: all .2s; }
.wd-dot.muscu { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); }
.wd-dot.swim { border-color: var(--teal); color: var(--teal); background: var(--teal-dim); }
.wd-dot.rest { border-color: var(--border); color: var(--text3); }
.wd-dot.done { background: var(--green); border-color: var(--green); color: #000; }
.wd-dot.today { box-shadow: 0 0 0 2px var(--blue); }

.section-title { font-size: 11px; font-family: var(--mono); color: var(--text3); letter-spacing: .1em; text-transform: uppercase; padding: 0 20px 12px; }
.day-cards { display: flex; flex-direction: column; gap: 10px; padding: 0 20px 20px; }
.day-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r2); padding: 16px; cursor: pointer; transition: border-color .2s, background .2s; active:background: var(--bg3); }
.day-card:active { background: var(--bg3); border-color: var(--border2); }
.day-card.today-card { border-color: var(--blue-dim); background: linear-gradient(135deg, var(--bg2) 0%, #0d1e33 100%); }
.dc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.dc-day { font-size: 11px; font-family: var(--mono); color: var(--text3); letter-spacing: .08em; }
.dc-badge { font-size: 10px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
.badge-forca { background: var(--blue-dim); color: var(--blue); }
.badge-hiper { background: var(--green-dim); color: var(--green); }
.badge-meta { background: var(--amber-dim); color: var(--amber); }
.dc-name { font-size: 18px; font-weight: 500; letter-spacing: -.3px; margin-bottom: 4px; }
.dc-sub { font-size: 12px; color: var(--text2); }
.dc-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.dc-stats { display: flex; gap: 14px; }
.dc-stat { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 4px; }
.dc-done-tag { font-size: 10px; color: var(--green); font-family: var(--mono); display: flex; align-items: center; gap: 4px; }

/* STATS CARDS */
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 20px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; }
.stat-n { font-size: 26px; font-weight: 600; font-family: var(--mono); }
.stat-l { font-size: 11px; color: var(--text3); margin-top: 3px; }

/* WORKOUT SCREEN */
.workout-header { padding: 16px 20px 0; display: flex; align-items: center; gap: 12px; }
.back-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.back-btn svg { width: 18px; height: 18px; stroke: var(--text2); }
.wh-info { flex: 1; }
.wh-day { font-size: 11px; font-family: var(--mono); color: var(--text3); letter-spacing: .08em; }
.wh-title { font-size: 20px; font-weight: 600; letter-spacing: -.3px; }
.progress-bar-wrap { margin: 16px 20px 0; background: var(--bg3); border-radius: 4px; height: 3px; }
.progress-bar { height: 3px; border-radius: 4px; background: var(--blue); transition: width .5s ease; }
.progress-label { font-size: 10px; font-family: var(--mono); color: var(--text3); padding: 6px 20px 0; }

/* BLOCKS */
.blocks-list { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
.block-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; }
.block-card.current { border-color: var(--blue); }
.block-card.done-block { opacity: .5; }
.block-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.bh-left { display: flex; align-items: center; gap: 10px; }
.block-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: var(--mono); font-weight: 500; flex-shrink: 0; }
.bn-warmup { background: var(--teal-dim); color: var(--teal); }
.bn-strength { background: var(--blue-dim); color: var(--blue); }
.bn-hyper { background: var(--green-dim); color: var(--green); }
.bn-meta { background: var(--amber-dim); color: var(--amber); }
.bn-core { background: var(--purple-dim); color: var(--purple); }
.bn-cool { background: var(--red-dim); color: var(--red); }
.bn-cardio { background: var(--teal-dim); color: var(--teal); }
.block-name { font-size: 14px; font-weight: 500; }
.block-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
.bh-right { display: flex; align-items: center; gap: 8px; }
.block-time { font-size: 11px; font-family: var(--mono); color: var(--text3); }
.check-circle { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0; }
.check-circle.checked { background: var(--green); border-color: var(--green); }
.check-circle svg { width: 12px; height: 12px; stroke: #000; display: none; }
.check-circle.checked svg { display: block; }

.block-body { display: none; border-top: 1px solid var(--border); }
.block-body.open { display: block; }

.exercise-row { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
.exercise-row:last-child { border-bottom: none; }
.ex-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.ex-n { font-size: 13px; font-weight: 500; flex: 1; }
.ex-sets { font-size: 12px; font-family: var(--mono); color: var(--blue); white-space: nowrap; }
.ex-detail { font-size: 11px; color: var(--text2); line-height: 1.5; }
.ex-timing { font-size: 11px; color: var(--amber); font-family: var(--mono); margin-top: 2px; }
.ex-warn { font-size: 11px; color: var(--red); margin-top: 3px; display: flex; gap: 4px; }
.ex-tip { font-size: 11px; color: var(--text3); margin-top: 2px; font-style: italic; }
.super-label { font-size: 9px; padding: 2px 7px; border-radius: 10px; background: var(--amber-dim); color: var(--amber); font-weight: 600; letter-spacing: .05em; margin-left: 6px; vertical-align: middle; }
.drop-label { font-size: 9px; padding: 2px 7px; border-radius: 10px; background: var(--red-dim); color: var(--red); font-weight: 600; letter-spacing: .05em; margin-left: 6px; vertical-align: middle; }
.solo-label { font-size: 9px; padding: 2px 7px; border-radius: 10px; background: var(--bg4); color: var(--text3); font-weight: 600; letter-spacing: .05em; margin-left: 6px; vertical-align: middle; }
.opt-label { font-size: 9px; padding: 2px 7px; border-radius: 10px; background: var(--teal-dim); color: var(--teal); font-weight: 600; letter-spacing: .05em; margin-left: 6px; vertical-align: middle; }

.pause-row { padding: 10px 16px; background: var(--bg3); display: flex; align-items: center; justify-content: space-between; }
.pause-info { font-size: 11px; color: var(--text3); font-family: var(--mono); }
.start-timer-btn { font-size: 11px; font-family: var(--mono); padding: 6px 14px; border-radius: 20px; background: var(--bg4); border: 1px solid var(--border2); color: var(--text2); cursor: pointer; transition: all .2s; }
.start-timer-btn:active { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); }

/* DONE BTN */
.done-block-btn { margin: 0 16px 14px; width: calc(100% - 32px); padding: 13px; border-radius: var(--r); background: var(--blue-dim); border: 1px solid var(--blue); color: var(--blue); font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s; }
.done-block-btn:active { background: var(--blue); color: #fff; }

.finish-btn { margin: 16px 20px; padding: 18px; border-radius: var(--r2); background: var(--green); border: none; color: #000; font-family: var(--sans); font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: -.2px; }

/* TIMER OVERLAY */
.timer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 200; flex-direction: column; align-items: center; justify-content: center; gap: 20px; max-width: 480px; left: 50%; transform: translateX(-50%); }
.timer-overlay.active { display: flex; }
.timer-label { font-size: 12px; font-family: var(--mono); color: var(--text3); letter-spacing: .1em; text-transform: uppercase; }
.timer-ring { position: relative; width: 200px; height: 200px; }
.timer-ring svg { transform: rotate(-90deg); }
.timer-ring circle { fill: none; stroke-width: 6; }
.ring-bg { stroke: var(--bg3); }
.ring-fg { stroke: var(--blue); stroke-linecap: round; transition: stroke-dashoffset .9s linear; }
.timer-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 56px; font-family: var(--mono); font-weight: 500; letter-spacing: -2px; }
.timer-msg { font-size: 14px; color: var(--text2); }
.timer-skip { padding: 12px 32px; border-radius: 30px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); font-family: var(--sans); font-size: 14px; cursor: pointer; }
.timer-skip:active { background: var(--bg4); }
.timer-add { padding: 12px 20px; border-radius: 30px; background: transparent; border: 1px solid var(--border); color: var(--text3); font-family: var(--sans); font-size: 13px; cursor: pointer; }
.timer-btns { display: flex; gap: 10px; }

/* HISTORY */
.hist-header { padding: 48px 20px 20px; }
.hist-title { font-size: 24px; font-weight: 300; letter-spacing: -.5px; }
.hist-title span { color: var(--green); font-weight: 600; }
.hist-empty { padding: 40px 20px; text-align: center; color: var(--text3); font-size: 14px; line-height: 1.8; }
.hist-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
.hist-item { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r2); padding: 14px 16px; }
.hi-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.hi-name { font-size: 15px; font-weight: 500; }
.hi-date { font-size: 11px; font-family: var(--mono); color: var(--text3); }
.hi-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.hi-tag { font-size: 10px; padding: 3px 9px; border-radius: 10px; background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.hi-dur { font-size: 11px; color: var(--text3); font-family: var(--mono); }
.clear-hist { margin: 20px; padding: 12px; border-radius: var(--r); background: transparent; border: 1px solid var(--border); color: var(--text3); font-family: var(--sans); font-size: 13px; cursor: pointer; width: calc(100% - 40px); }

/* COMPLETION */
.complete-screen { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 300; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px 30px; max-width: 480px; left: 50%; transform: translateX(-50%); }
.complete-screen.active { display: flex; }
.complete-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--green-dim); border: 2px solid var(--green); display: flex; align-items: center; justify-content: center; }
.complete-icon svg { width: 36px; height: 36px; stroke: var(--green); }
.complete-title { font-size: 28px; font-weight: 300; letter-spacing: -.5px; text-align: center; }
.complete-title span { color: var(--green); font-weight: 600; }
.complete-sub { font-size: 14px; color: var(--text2); text-align: center; line-height: 1.6; }
.complete-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.complete-tag { font-size: 11px; padding: 5px 12px; border-radius: 20px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); }
.complete-back { width: 100%; padding: 16px; border-radius: var(--r2); background: var(--green); border: none; color: #000; font-family: var(--sans); font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div class="screen active" id="screen-home">
  <div class="home-header">
    <div class="home-greeting" id="greeting">BOM DIA</div>
    <div class="home-title">Seu treino<br><span id="today-label">de hoje</span></div>
  </div>
  <div class="week-strip" id="week-strip"></div>
  <div class="section-title">SESSÕES DA SEMANA</div>
  <div class="day-cards" id="day-cards"></div>
  <div class="section-title">RESUMO</div>
  <div class="stats-row" id="stats-row"></div>
</div>

<!-- WORKOUT SCREEN -->
<div class="screen" id="screen-workout">
  <div class="workout-header">
    <div class="back-btn" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </div>
    <div class="wh-info">
      <div class="wh-day" id="wday-label"></div>
      <div class="wh-title" id="wday-title"></div>
    </div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
  <div class="progress-label" id="prog-label">0 de 0 blocos</div>
  <div class="blocks-list" id="blocks-list"></div>
  <button class="finish-btn" id="finish-btn" onclick="finishWorkout()" style="display:none">Concluir treino ✓</button>
</div>

<!-- HISTORY SCREEN -->
<div class="screen" id="screen-history">
  <div class="hist-header">
    <div class="home-greeting">REGISTRO</div>
    <div class="hist-title">Treinos<br><span>realizados</span></div>
  </div>
  <div class="stats-row" id="hist-stats"></div>
  <div class="section-title">HISTÓRICO</div>
  <div id="hist-content"></div>
  <button class="clear-hist" onclick="clearHistory()">Limpar histórico</button>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
    <span class="nav-label">HOJE</span>
  </button>
  <button class="nav-btn" id="nav-history" onclick="switchTab('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
    <span class="nav-label">HISTÓRICO</span>
  </button>
</nav>

<!-- TIMER OVERLAY -->
<div class="timer-overlay" id="timer-overlay">
  <div class="timer-label" id="timer-label">DESCANSO</div>
  <div class="timer-ring">
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="88"/>
      <circle class="ring-fg" id="ring-fg" cx="100" cy="100" r="88" stroke-dasharray="553" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-num" id="timer-num">90</div>
  </div>
  <div class="timer-msg" id="timer-msg">Próximo: —</div>
  <div class="timer-btns">
    <button class="timer-add" onclick="addTime(30)">+30s</button>
    <button class="timer-skip" onclick="skipTimer()">Pular ↗</button>
  </div>
</div>

<!-- COMPLETION -->
<div class="complete-screen" id="complete-screen">
  <div class="complete-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20,6 9,17 4,12"/></svg>
  </div>
  <div class="complete-title">Treino<br><span>concluído!</span></div>
  <div class="complete-sub" id="complete-sub">Excelente sessão.</div>
  <div class="complete-tags" id="complete-tags"></div>
  <button class="complete-back" onclick="goHome()">Voltar ao início</button>
</div>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────────
const WORKOUTS = [
  {
    id: 'seg',

      },
      {
        id:'A', type:'strength', name:'Superset A — Empurra + Puxa', time:'5–16 min',

          {n:'A1 · Supino inclinado com halteres', sets:'3×5', detail:'Banco ~45° · peito superior · amplitude completa', timing:'Tempo 3-1-1 (3s descer, 1s pausa, 1s subir)', warn:'', tip:''},
          {n:'A2 · Remada serrote com haltere', sets:'3×5 cada', detail:'Apoio joelho + mão no mesmo banco · retração escapular', timing:'Tempo 2-1-1 · sem pausa entre lados', warn:'', tip:'Mesmo banco, mesmos halteres. Zero deslocamento.'},

      },
      {
        id:'C', type:'strength', name:'Desenvolvimento com halteres', time:'26–30 min',
        exercises:[
          {n:'Desenvolvimento sentado', sets:'3×5', detail:'Banco 80–85° · ombros · amplitude controlada', timing:'Tempo 2-1-1', warn:'⚠ Sem hiperextensão lombar.', tip:''},

      {

const DAY_SCHEDULE = {
  1: { workout: 'seg', label: 'SEG' },
  2: { swim: true, label: 'TER' },
  3: { workout: 'qua', label: 'QUA' },
  4: { swim: true, label: 'QUI' },
  5: { workout: 'sex', label: 'SEX' },
  6: { rest: true, label: 'SÁB' },
  0: { rest: true, label: 'DOM' },
};

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentWorkout = null;
let doneBlocks = new Set();
let timerInterval = null;
let timerSecondsLeft = 0;
let timerTotal = 0;
let timerCallback = null;

function getHistory() {
  try { return JSON.parse(localStorage.getItem('workout_history') || '[]'); } catch { return []; }
}
function saveHistory(h) { localStorage.setItem('workout_history', JSON.stringify(h)); }

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  const h = new Date().getHours();
  const greet = h < 12 ? 'BOM DIA' : h < 18 ? 'BOA TARDE' : 'BOA NOITE';
  document.getElementById('greeting').textContent = greet;

  const dow = new Date().getDay();
  const sched = DAY_SCHEDULE[dow];
  if (sched && sched.workout) {
    const w = WORKOUTS.find(x => x.id === sched.workout);
    document.getElementById('today-label').textContent = w ? w.type.toLowerCase() : 'de hoje';
  } else if (sched && sched.swim) {
    document.getElementById('today-label').textContent = 'de natação';
  } else {
    document.getElementById('today-label').textContent = 'de descanso';
  }

  renderWeekStrip();
  renderDayCards();
  renderStats();
}

function renderWeekStrip() {
  const today = new Date().getDay();
  const strip = document.getElementById('week-strip');
  const hist = getHistory();
  const doneDays = new Set(hist.map(h => h.workoutId));
  const days = [1,2,3,4,5,6,0];
  strip.innerHTML = days.map(d => {
    const s = DAY_SCHEDULE[d];
    const isToday = d === today;
    let cls = 'rest', letter = '–';
    if (s.workout) { cls = 'muscu'; letter = WORKOUTS.find(x=>x.id===s.workout)?.shortDay || s.label; }
    if (s.swim) { cls = 'swim'; letter = '🏊'; }
    if (s.rest) { cls = 'rest'; letter = '○'; }
    if (doneDays.has(s.workout)) cls = 'done';
    if (isToday) cls += ' today';
    return `<div class="week-day">
      <div class="wd-label">${s.label}</div>
      <div class="wd-dot ${cls}">${cls.includes('done') ? '✓' : letter}</div>
    </div>`;
  }).join('');
}

function renderDayCards() {
  const container = document.getElementById('day-cards');
  const today = new Date().getDay();
  const hist = getHistory();
  const doneDays = new Set(hist.map(h => h.workoutId));
  container.innerHTML = WORKOUTS.map(w => {
    const isToday = DAY_SCHEDULE[today]?.workout === w.id;
    const isDone = doneDays.has(w.id);
    return `<div class="day-card ${isToday ? 'today-card' : ''}" onclick="startWorkout('${w.id}')">
      <div class="dc-top">
        <div class="dc-day">${w.day.toUpperCase()}</div>
        <div class="dc-badge ${w.badge}">${w.type.toUpperCase()}</div>
      </div>
      <div class="dc-name">${w.type}</div>
      <div class="dc-sub">${w.muscles.slice(0,4).join(' · ')}</div>
      <div class="dc-footer">
        <div class="dc-stats">
          <div class="dc-stat">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
            ${w.duration}
          </div>
          <div class="dc-stat">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
            ${w.reps}
          </div>
        </div>
        ${isDone ? '<div class="dc-done-tag">✓ feito esta semana</div>' : (isToday ? '<div class="dc-done-tag" style="color:var(--amber)">● hoje</div>' : '')}
      </div>
    </div>`;
  }).join('');
}

function renderStats() {
  const hist = getHistory();
  const thisWeek = hist.filter(h => {
    const d = new Date(h.date);
    const now = new Date();
    const startOfWeek = new Date(now);
    startOfWeek.setDate(now.getDate() - now.getDay());
    startOfWeek.setHours(0,0,0,0);
    return d >= startOfWeek;
  });
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="stat-n" style="color:var(--blue)">${thisWeek.length}</div><div class="stat-l">treinos esta semana</div></div>
    <div class="stat-card"><div class="stat-n" style="color:var(--green)">${hist.length}</div><div class="stat-l">treinos no total</div></div>
  `;
}

// ─── WORKOUT ──────────────────────────────────────────────────────────────────
function startWorkout(id) {
  currentWorkout = WORKOUTS.find(w => w.id === id);
  doneBlocks = new Set();
  document.getElementById('wday-label').textContent = currentWorkout.day.toUpperCase();
  document.getElementById('wday-title').textContent = currentWorkout.type;
  renderBlocks();
  updateProgress();
  switchTab('workout');
}

function getBlockTypeClass(type) {
  const map = { warmup:'warmup', strength:'strength', hyper:'hyper', meta:'meta', core:'core', cool:'cool', cardio:'cardio' };
  return map[type] || 'strength';
}
function getNumClass(type) {
  const map = { warmup:'bn-warmup', strength:'bn-strength', hyper:'bn-hyper', meta:'bn-meta', core:'bn-core', cool:'bn-cool', cardio:'bn-cardio' };
  return map[type] || 'bn-strength';
}

function renderBlocks() {
  const list = document.getElementById('blocks-list');
  if (!currentWorkout) return;
  list.innerHTML = currentWorkout.blocks.map((block, i) => {
    const tc = getBlockTypeClass(block.type);
    const nc = getNumClass(block.type);
    const tagHtml = block.tag === 'super' ? '<span class="super-label">SUPERSET</span>' :
                    block.tag === 'drop' ? '<span class="drop-label">DROPSET</span>' :
                    block.tag === 'opt' ? '<span class="opt-label">OPCIONAL</span>' :
                    block.tag === 'solo' ? '<span class="solo-label">SOLO</span>' : '';
    const exHtml = block.exercises.map(ex => `
      <div class="exercise-row">
        <div class="ex-top">
          <div class="ex-n">${ex.n}</div>
          <div class="ex-sets">${ex.sets}</div>
        </div>
        ${ex.detail ? `<div class="ex-detail">${ex.detail}</div>` : ''}
        ${ex.timing ? `<div class="ex-timing">⏱ ${ex.timing}</div>` : ''}
        ${ex.warn ? `<div class="ex-warn">${ex.warn}</div>` : ''}
        ${ex.tip ? `<div class="ex-tip">${ex.tip}</div>` : ''}
      </div>
    `).join('');
    const pauseHtml = block.rest > 0 ? `
      <div class="pause-row">
        <div class="pause-info">⏸ ${block.restLabel}</div>
        <button class="start-timer-btn" onclick="startRestTimer(${block.rest}, '${block.id}', event)">Iniciar ▶</button>
      </div>` : '';
    return `<div class="block-card" id="block-${block.id}">
      <div class="block-header" onclick="toggleBlock('${block.id}')">
        <div class="bh-left">
          <div class="block-num ${nc}">${i+1}</div>
          <div>
            <div class="block-name">${block.name}${tagHtml}</div>
            <div class="block-meta">${block.time}</div>
          </div>
        </div>
        <div class="bh-right">
          <div class="check-circle" id="check-${block.id}" onclick="toggleDone('${block.id}', event)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20,6 9,17 4,12"/></svg>
          </div>
        </div>
      </div>
      <div class="block-body" id="body-${block.id}">
        ${exHtml}
        ${pauseHtml}
        <button class="done-block-btn" onclick="markDone('${block.id}')">Marcar como feito ✓</button>
      </div>
    </div>`;
  }).join('');
  if (currentWorkout.blocks.length > 0) {
    const firstId = currentWorkout.blocks[0].id;
    document.getElementById('body-' + firstId).classList.add('open');
  }
  document.getElementById('finish-btn').style.display = 'none';
}

function toggleBlock(id) {
  const body = document.getElementById('body-' + id);
  const isOpen = body.classList.contains('open');
  document.querySelectorAll('.block-body').forEach(b => b.classList.remove('open'));
  if (!isOpen) body.classList.add('open');
}

function markDone(id) {
  doneBlocks.add(id);
  const card = document.getElementById('block-' + id);
  const check = document.getElementById('check-' + id);
  card.classList.add('done-block');
  check.classList.add('checked');
  document.getElementById('body-' + id).classList.remove('open');
  updateProgress();
  const blocks = currentWorkout.blocks;
  const idx = blocks.findIndex(b => b.id === id);
  if (idx < blocks.length - 1) {
    const nextId = blocks[idx + 1].id;
    document.getElementById('block-' + nextId).classList.add('current');
    document.getElementById('body-' + nextId).classList.add('open');
    document.getElementById('block-' + nextId).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  if (doneBlocks.size === blocks.length) {
    document.getElementById('finish-btn').style.display = 'block';
    document.getElementById('finish-btn').scrollIntoView({ behavior: 'smooth' });
  }
}

function toggleDone(id, e) {
  e.stopPropagation();
  if (doneBlocks.has(id)) {
    doneBlocks.delete(id);
    document.getElementById('block-' + id).classList.remove('done-block');
    document.getElementById('check-' + id).classList.remove('checked');
  } else {
    markDone(id);
  }
  updateProgress();
}

function updateProgress() {
  if (!currentWorkout) return;
  const total = currentWorkout.blocks.length;
  const done = doneBlocks.size;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${done} de ${total} blocos concluídos`;
}

function finishWorkout() {
  const hist = getHistory();
  hist.unshift({
    workoutId: currentWorkout.id,
    workoutType: currentWorkout.type,
    day: currentWorkout.day,
    muscles: currentWorkout.muscles,
    date: new Date().toISOString(),
    duration: currentWorkout.duration,
  });
  saveHistory(hist);
  showCompletion();
}

function showCompletion() {
  const w = currentWorkout;
  document.getElementById('complete-sub').textContent = `${w.day} · ${w.type} · ${w.duration}`;
  document.getElementById('complete-tags').innerHTML = w.muscles.map(m =>
    `<span class="complete-tag">${m}</span>`).join('');
  document.getElementById('complete-screen').classList.add('active');
}

function goHome() {
  document.getElementById('complete-screen').classList.remove('active');
  currentWorkout = null;
  doneBlocks = new Set();
  renderWeekStrip();
  renderDayCards();
  renderStats();
  switchTab('home');
}

// ─── TIMER ────────────────────────────────────────────────────────────────────
function startRestTimer(seconds, blockId, e) {
  if (e) e.stopPropagation();
  timerSecondsLeft = seconds;
  timerTotal = seconds;
  const overlay = document.getElementById('timer-overlay');
  overlay.classList.add('active');
  updateTimerUI();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerSecondsLeft--;
    updateTimerUI();
    if (timerSecondsLeft <= 0) {
      clearInterval(timerInterval);
      overlay.classList.remove('active');
      if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
    }
  }, 1000);
}

function updateTimerUI() {
  document.getElementById('timer-num').textContent = timerSecondsLeft;
  const circumference = 553;
  const progress = timerSecondsLeft / timerTotal;
  const offset = circumference * (1 - progress);
  document.getElementById('ring-fg').style.strokeDashoffset = offset;
  const color = timerSecondsLeft > timerTotal * 0.5 ? '#4a9eff' :
                timerSecondsLeft > timerTotal * 0.25 ? '#ffb347' : '#ff5f57';
  document.getElementById('ring-fg').style.stroke = color;
}

function skipTimer() {
  clearInterval(timerInterval);
  document.getElementById('timer-overlay').classList.remove('active');
}

function addTime(s) {
  timerSecondsLeft += s;
  timerTotal += s;
  updateTimerUI();
}

// ─── HISTORY ─────────────────────────────────────────────────────────────────
function renderHistory() {
  const hist = getHistory();
  const thisWeek = hist.filter(h => {
    const d = new Date(h.date);
    const now = new Date();
    const sow = new Date(now);
    sow.setDate(now.getDate() - now.getDay());
    sow.setHours(0,0,0,0);
    return d >= sow;
  });
  const allMuscles = {};
  hist.forEach(h => h.muscles.forEach(m => { allMuscles[m] = (allMuscles[m]||0)+1; }));
  const topMuscle = Object.entries(allMuscles).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('hist-stats').innerHTML = `
    <div class="stat-card"><div class="stat-n" style="color:var(--blue)">${thisWeek.length}</div><div class="stat-l">esta semana</div></div>
    <div class="stat-card"><div class="stat-n" style="color:var(--green)">${hist.length}</div><div class="stat-l">total de treinos</div></div>
    <div class="stat-card"><div class="stat-n" style="color:var(--amber)">${Math.floor(hist.length * 45)}</div><div class="stat-l">minutos treinados</div></div>
    <div class="stat-card"><div class="stat-n" style="color:var(--purple); font-size:14px; padding-top:4px">${topMuscle ? topMuscle[0] : '—'}</div><div class="stat-l">grupo mais treinado</div></div>
  `;
  const container = document.getElementById('hist-content');
  if (hist.length === 0) {
    container.innerHTML = '<div class="hist-empty">Nenhum treino registrado ainda.<br>Complete sua primeira sessão<br>e ela aparecerá aqui.</div>';
    return;
  }
  container.innerHTML = '<div class="hist-list">' + hist.map(h => {
    const d = new Date(h.date);
    const dateStr = d.toLocaleDateString('pt-BR', { weekday:'short', day:'numeric', month:'short' });
    const timeStr = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    return `<div class="hist-item">
      <div class="hi-top">
        <div class="hi-name">${h.workoutType} <span style="font-size:12px;color:var(--text3);font-weight:400">· ${h.day.split('-')[0].trim()}</span></div>
        <div class="hi-date">${dateStr} ${timeStr}</div>
      </div>
      <div class="hi-tags">${h.muscles.map(m=>`<span class="hi-tag">${m}</span>`).join('')}</div>
      <div class="hi-dur">${h.duration}</div>
    </div>`;
  }).join('') + '</div>';
}

function clearHistory() {
  if (confirm('Apagar todo o histórico de treinos?')) {
    localStorage.removeItem('workout_history');
    renderHistory();
    renderWeekStrip();
    renderDayCards();
    renderStats();
  }
}

// ─── NAV ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (tab === 'home') {
    document.getElementById('screen-home').classList.add('active');
    document.getElementById('nav-home').classList.add('active');
    document.querySelector('.bottom-nav').style.display = 'flex';
  } else if (tab === 'history') {
    document.getElementById('screen-history').classList.add('active');
    document.getElementById('nav-history').classList.add('active');
    document.querySelector('.bottom-nav').style.display = 'flex';
    renderHistory();
  } else if (tab === 'workout') {
    document.getElementById('screen-workout').classList.add('active');
    document.querySelector('.bottom-nav').style.display = 'none';
    window.scrollTo(0,0);
  }
}

init();
</script>
