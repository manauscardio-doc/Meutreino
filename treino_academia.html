<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Treino</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;--bg4:#222222;--border:#2a2a2a;--border2:#333333;--text:#f0f0f0;--text2:#999999;--text3:#555555;--blue:#4a9eff;--blue-dim:#1a3a5c;--green:#3ddc84;--green-dim:#0d3320;--amber:#ffb347;--amber-dim:#3d2800;--red:#ff5f57;--red-dim:#3d1510;--purple:#b388ff;--purple-dim:#2a1a4a;--teal:#26c6a2;--teal-dim:#0a2e25;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--r:10px;--r2:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overscroll-behavior:none}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;min-height:100dvh}
.screen{display:none;flex-direction:column;flex:1;overflow-y:auto;padding-bottom:90px}
.screen.active{display:flex}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;padding:10px 0 14px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text3);cursor:pointer;transition:color .2s;font-family:var(--sans)}
.nav-btn.active{color:var(--blue)}
.nav-btn svg{width:20px;height:20px;stroke-width:1.8}
.nav-label{font-size:9px;font-weight:500;letter-spacing:.04em}
/* HOME */
.home-header{padding:48px 20px 20px}
.home-greeting{font-size:13px;color:var(--text3);font-family:var(--mono);letter-spacing:.08em;margin-bottom:6px}
.home-title{font-size:26px;font-weight:300;letter-spacing:-.5px;line-height:1.2}
.home-title span{color:var(--blue);font-weight:600}
.week-strip{display:flex;gap:6px;padding:0 20px 20px;overflow-x:auto;scrollbar-width:none}
.week-strip::-webkit-scrollbar{display:none}
.week-day{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:42px}
.wd-label{font-size:9px;color:var(--text3);font-family:var(--mono);text-transform:uppercase}
.wd-dot{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--text3)}
.wd-dot.muscu{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.wd-dot.swim{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.wd-dot.done{background:var(--green);border-color:var(--green);color:#000}
.wd-dot.today{box-shadow:0 0 0 2px var(--blue)}
.slbl{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:0 20px 10px}
.day-cards{display:flex;flex-direction:column;gap:10px;padding:0 20px 16px}
.day-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px;cursor:pointer}
.day-card.today-card{border-color:var(--blue-dim);background:linear-gradient(135deg,var(--bg2) 0%,#0d1e33 100%)}
.dc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.dc-day{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.08em}
.dc-badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:500}
.badge-forca{background:var(--blue-dim);color:var(--blue)}
.badge-hiper{background:var(--green-dim);color:var(--green)}
.badge-meta{background:var(--amber-dim);color:var(--amber)}
.dc-name{font-size:18px;font-weight:500;letter-spacing:-.3px;margin-bottom:3px}
.dc-sub{font-size:12px;color:var(--text2)}
.dc-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.dc-stats{display:flex;gap:12px}
.dc-stat{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.dc-done-tag{font-size:10px;color:var(--green);font-family:var(--mono)}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 20px 16px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.stat-n{font-size:24px;font-weight:600;font-family:var(--mono)}
.stat-l{font-size:11px;color:var(--text3);margin-top:2px}
/* WORKOUT */
.workout-header{padding:16px 20px 0;display:flex;align-items:center;gap:12px}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.back-btn svg{width:18px;height:18px;stroke:var(--text2)}
.wh-info{flex:1}
.wh-day{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.08em}
.wh-title{font-size:20px;font-weight:600;letter-spacing:-.3px}
.progress-bar-wrap{margin:14px 20px 0;background:var(--bg3);border-radius:4px;height:3px}
.progress-bar{height:3px;border-radius:4px;background:var(--blue);transition:width .5s}
.progress-label{font-size:10px;font-family:var(--mono);color:var(--text3);padding:5px 20px 0}
.blocks-list{padding:14px 20px;display:flex;flex-direction:column;gap:10px}
.block-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.block-card.current{border-color:var(--blue)}
.block-card.done-block{opacity:.5}
.block-header{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.bh-left{display:flex;align-items:center;gap:10px}
.block-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono);font-weight:500;flex-shrink:0}
.bn-warmup{background:var(--teal-dim);color:var(--teal)}
.bn-strength{background:var(--blue-dim);color:var(--blue)}
.bn-hyper{background:var(--green-dim);color:var(--green)}
.bn-meta{background:var(--amber-dim);color:var(--amber)}
.bn-core{background:var(--purple-dim);color:var(--purple)}
.bn-cool{background:var(--red-dim);color:var(--red)}
.bn-cardio{background:var(--teal-dim);color:var(--teal)}
.block-name{font-size:14px;font-weight:500}
.block-meta{font-size:11px;color:var(--text3);margin-top:2px}
.check-circle{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.check-circle.checked{background:var(--green);border-color:var(--green)}
.check-circle svg{width:12px;height:12px;stroke:#000;display:none}
.check-circle.checked svg{display:block}
.block-body{display:none;border-top:1px solid var(--border)}
.block-body.open{display:block}
.exercise-row{padding:11px 16px;border-bottom:1px solid var(--border)}
.exercise-row:last-child{border-bottom:none}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-n{font-size:13px;font-weight:500;flex:1}
.ex-sets{font-size:12px;font-family:var(--mono);color:var(--blue);white-space:nowrap}
.ex-detail{font-size:11px;color:var(--text2);line-height:1.5;margin-top:2px}
.ex-timing{font-size:11px;color:var(--amber);font-family:var(--mono);margin-top:2px}
.ex-warn{font-size:11px;color:var(--red);margin-top:2px;display:flex;gap:4px}
.ex-tip{font-size:11px;color:var(--text3);margin-top:2px;font-style:italic}
.super-label,.drop-label,.solo-label,.opt-label{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:600;letter-spacing:.05em;margin-left:5px;vertical-align:middle}
.super-label{background:var(--amber-dim);color:var(--amber)}
.drop-label{background:var(--red-dim);color:var(--red)}
.solo-label{background:var(--bg4);color:var(--text3)}
.opt-label{background:var(--teal-dim);color:var(--teal)}
.peso-row{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border2);flex-wrap:wrap}
.peso-label{font-size:11px;color:var(--text3);white-space:nowrap}
.peso-input{background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--mono);font-size:13px;padding:6px 10px;width:80px;text-align:center}
.peso-input:focus{outline:none;border-color:var(--blue)}
.peso-input::placeholder{color:var(--text3)}
.peso-last{font-size:10px;color:var(--text3);font-family:var(--mono)}
.peso-save-btn{padding:6px 12px;border-radius:var(--r);background:var(--blue-dim);border:1px solid var(--blue);color:var(--blue);font-family:var(--sans);font-size:11px;cursor:pointer}
.peso-save-btn:active{background:var(--blue);color:#000}
.ex-timer-btn{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:5px 12px;border-radius:20px;background:var(--purple-dim);border:1px solid var(--purple);color:var(--purple);font-family:var(--sans);font-size:11px;cursor:pointer}
.ex-timer-btn svg{width:12px;height:12px;stroke:currentColor;stroke-width:2}
.pause-row{padding:10px 16px;background:var(--bg3);display:flex;align-items:center;justify-content:space-between}
.pause-info{font-size:11px;color:var(--text3);font-family:var(--mono)}
.start-timer-btn{font-size:11px;font-family:var(--mono);padding:6px 14px;border-radius:20px;background:var(--bg4);border:1px solid var(--border2);color:var(--text2);cursor:pointer}
.done-block-btn{margin:0 16px 12px;width:calc(100% - 32px);padding:13px;border-radius:var(--r);background:var(--blue-dim);border:1px solid var(--blue);color:var(--blue);font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer}
.done-block-btn:active{background:var(--blue);color:#fff}
.finish-btn{margin:14px 20px 4px;padding:18px;border-radius:var(--r2);background:var(--green);border:none;color:#000;font-family:var(--sans);font-size:16px;font-weight:600;cursor:pointer}
.finish-early-btn{margin:0 20px 20px;padding:13px;border-radius:var(--r2);background:transparent;border:1px solid var(--border2);color:var(--text3);font-family:var(--sans);font-size:13px;cursor:pointer}
/* TIMER */
.timer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:18px;max-width:480px;left:50%;transform:translateX(-50%)}
.timer-overlay.active{display:flex}
.timer-label{font-size:12px;font-family:var(--mono);color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.timer-ring{position:relative;width:200px;height:200px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:6}
.ring-bg{stroke:var(--bg3)}
.ring-fg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-family:var(--mono);font-weight:500;letter-spacing:-2px}
.timer-msg{font-size:14px;color:var(--text2);text-align:center;padding:0 20px}
.timer-btns{display:flex;gap:10px}
.timer-skip{padding:12px 32px;border-radius:30px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-family:var(--sans);font-size:14px;cursor:pointer}
.timer-add{padding:12px 20px;border-radius:30px;background:transparent;border:1px solid var(--border);color:var(--text3);font-family:var(--sans);font-size:13px;cursor:pointer}
/* EVOLUÇÃO */
.evo-header{padding:48px 20px 16px}
.evo-title{font-size:24px;font-weight:300;letter-spacing:-.5px}
.evo-title span{color:var(--amber);font-weight:600}
.filter-row{display:flex;gap:6px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:var(--sans);font-size:12px;cursor:pointer;white-space:nowrap}
.filter-btn.active{font-weight:500}
.filter-btn.f-all.active{background:var(--bg3);border-color:var(--border2);color:var(--text)}
.filter-btn.f-forca.active{background:var(--blue-dim);border-color:var(--blue);color:var(--blue)}
.filter-btn.f-hiper.active{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.filter-btn.f-meta.active{background:var(--amber-dim);border-color:var(--amber);color:var(--amber)}
.period-row{display:flex;gap:6px;padding:0 20px 16px}
.period-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:var(--mono);font-size:11px;cursor:pointer}
.period-btn.active{background:var(--bg3);border-color:var(--border2);color:var(--text2)}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);margin:0 20px 12px;padding:14px 16px;overflow:hidden}
.chart-title{font-size:13px;font-weight:500;margin-bottom:4px}
.chart-sub{font-size:11px;color:var(--text3);margin-bottom:12px}
.chart-canvas-wrap{position:relative;height:120px;width:100%}
canvas.chart-cv{width:100%!important;height:120px!important}
.chart-empty{height:80px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3)}
.chart-delta{font-size:11px;font-family:var(--mono);margin-top:8px}
.delta-up{color:var(--green)}
.delta-down{color:var(--red)}
.delta-eq{color:var(--text3)}
.evo-empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px;line-height:1.8}
/* HISTÓRICO */
.hist-header{padding:48px 20px 16px}
.hist-title{font-size:24px;font-weight:300;letter-spacing:-.5px}
.hist-title span{color:var(--green);font-weight:600}
.hist-empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:14px;line-height:1.8}
.hist-list{padding:0 20px;display:flex;flex-direction:column;gap:8px}
.hist-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:13px 15px}
.hi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.hi-name{font-size:14px;font-weight:500}
.hi-date{font-size:10px;font-family:var(--mono);color:var(--text3)}
.hi-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.hi-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.hi-dur{font-size:11px;color:var(--text3);font-family:var(--mono)}
/* RELATÓRIO */
.rel-header{padding:48px 20px 16px}
.rel-title{font-size:24px;font-weight:300;letter-spacing:-.5px}
.rel-title span{color:var(--purple);font-weight:600}
.rel-section{padding:0 20px 12px;display:flex;flex-direction:column;gap:8px}
.rel-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px}
.rel-card-title{font-size:13px;font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.rel-table{width:100%;border-collapse:collapse;font-size:11px}
.rel-table th{color:var(--text3);text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);font-weight:500;font-family:var(--mono)}
.rel-table td{padding:5px 6px;border-bottom:1px solid var(--border);color:var(--text2)}
.rel-table td:first-child{color:var(--text);font-weight:500}
.rel-table tr:last-child td{border-bottom:none}
.export-btn{margin:0 20px 10px;padding:16px;border-radius:var(--r2);border:none;font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.export-pdf{background:var(--purple);color:#fff}
.export-json{background:var(--bg2);border:1px solid var(--border);color:var(--text2)}
.send-claude{background:var(--blue-dim);border:1px solid var(--blue);color:var(--blue)}
/* COMPLETE */
.complete-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 30px;max-width:480px;left:50%;transform:translateX(-50%)}
.complete-screen.active{display:flex}
.complete-icon{width:80px;height:80px;border-radius:50%;background:var(--green-dim);border:2px solid var(--green);display:flex;align-items:center;justify-content:center}
.complete-icon svg{width:36px;height:36px;stroke:var(--green)}
.complete-title{font-size:26px;font-weight:300;letter-spacing:-.5px;text-align:center}
.complete-title span{color:var(--green);font-weight:600}
.complete-sub{font-size:13px;color:var(--text2);text-align:center;line-height:1.6}
.complete-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.complete-tag{font-size:11px;padding:4px 11px;border-radius:20px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2)}
.complete-back{width:100%;padding:16px;border-radius:var(--r2);background:var(--green);border:none;color:#000;font-family:var(--sans);font-size:16px;font-weight:600;cursor:pointer;margin-top:6px}
</style>
</head>
<body>

<div class="screen active" id="screen-home">
  <div class="home-header">
    <div class="home-greeting" id="greeting">BOM DIA</div>
    <div class="home-title">Seu treino<br><span id="today-label">de hoje</span></div>
  </div>
  <div class="week-strip" id="week-strip"></div>
  <div class="slbl">SESSÕES DA SEMANA</div>
  <div class="day-cards" id="day-cards"></div>
  <div class="slbl">RESUMO</div>
  <div class="stats-row" id="stats-row"></div>
</div>

<div class="screen" id="screen-workout">
  <div class="workout-header">
    <div class="back-btn" onclick="goHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></div>
    <div class="wh-info"><div class="wh-day" id="wday-label"></div><div class="wh-title" id="wday-title"></div></div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
  <div class="progress-label" id="prog-label">0 de 0 blocos</div>
  <div class="blocks-list" id="blocks-list"></div>
  <button class="finish-btn" id="finish-btn" onclick="finishWorkout()" style="display:none">Concluir treino ✓</button>
  <button class="finish-early-btn" id="finish-early-btn" onclick="finishEarly()">Finalizar agora (incompleto)</button>
</div>

<div class="screen" id="screen-evo">
  <div class="evo-header">
    <div class="home-greeting">GRÁFICOS</div>
    <div class="evo-title">Evolução<br><span>de cargas</span></div>
  </div>
  <div class="filter-row" id="evo-filter"></div>
  <div class="period-row" id="evo-period"></div>
  <div id="evo-charts"></div>
</div>

<div class="screen" id="screen-history">
  <div class="hist-header">
    <div class="home-greeting">REGISTRO</div>
    <div class="hist-title">Treinos<br><span>realizados</span></div>
  </div>
  <div class="stats-row" id="hist-stats"></div>
  <div class="slbl">HISTÓRICO</div>
  <div id="hist-content"></div>
</div>

<div class="screen" id="screen-rel">
  <div class="rel-header">
    <div class="home-greeting">EXPORTAR</div>
    <div class="rel-title">Relatório<br><span>de progressão</span></div>
  </div>
  <button class="export-btn export-pdf" onclick="exportPDF()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
    Exportar relatório PDF
  </button>
  <button class="export-btn export-json" onclick="exportJSON()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Backup JSON (Google Drive)
  </button>
  <button class="export-btn send-claude" onclick="exportForClaude()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    Copiar dados para análise no Claude
  </button>
  <div class="slbl" style="margin-top:8px">PRÉ-VISUALIZAÇÃO</div>
  <div class="rel-section" id="rel-preview"></div>
  <div style="height:20px"></div>
</div>

function getHistory(){try{return JSON.parse(localStorage.getItem('wh')||'[]')}catch{return[]}}
function saveHistory(h){localStorage.setItem('wh',JSON.stringify(h))}
function getAllWeights(){try{return JSON.parse(localStorage.getItem('ww')||'{}')}catch{return{}}}
function saveAllWeights(w){localStorage.setItem('ww',JSON.stringify(w))}
function wKey(wid,bid,name){return`${wid}__${bid}__${name.replace(/[^a-z0-9]/gi,'_')}`}
function getLastW(wid,bid,name){const all=getAllWeights();const k=wKey(wid,bid,name);const e=all[k]||[];return e.length?e[e.length-1]:null;}
function saveW(wid,bid,name,val){const all=getAllWeights();const k=wKey(wid,bid,name);if(!all[k])all[k]=[];all[k].push({date:new Date().toISOString(),peso:val});if(all[k].length>30)all[k]=all[k].slice(-30);saveAllWeights(all);}

// ── AUDIO ─────────────────────────────────────────────────────────────────────
function ensureAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(freq,dur,vol,delay){
  ensureAudio();if(!audioCtx)return;
  try{
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=freq;o.type='sine';
    const t=audioCtx.currentTime+(delay||0);
    g.gain.setValueAtTime(vol||0.3,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function playRestEnd(){beep(880,0.12,0.4,0);beep(880,0.12,0.4,0.18);beep(1320,0.25,0.5,0.36);}
function playExEnd(){beep(660,0.15,0.4,0);beep(880,0.3,0.5,0.2);}

function init(){
  const h=new Date().getHours();
  document.getElementById('greeting').textContent=h<12?'BOM DIA':h<18?'BOA TARDE':'BOA NOITE';
  const dow=new Date().getDay();const s=DAY_SCHEDULE[dow];
  if(s&&s.workout){const w=WORKOUTS.find(x=>x.id===s.workout);document.getElementById('today-label').textContent=w?w.type.toLowerCase():'de hoje';}
  else if(s&&s.swim)document.getElementById('today-label').textContent='de natação';
  else document.getElementById('today-label').textContent='de descanso';
  renderWeekStrip();renderDayCards();renderStatsHome();
}
function renderWeekStrip(){
  const today=new Date().getDay();const hist=getHistory();const doneDays=new Set(hist.map(h=>h.workoutId));
  const days=[1,2,3,4,5,6,0];
  document.getElementById('week-strip').innerHTML=days.map(d=>{
    const s=DAY_SCHEDULE[d];const isToday=d===today;
    let cls='rest',letter='–';
    if(s.workout){cls='muscu';letter=WORKOUTS.find(x=>x.id===s.workout)?.shortDay||s.label;}
    if(s.swim){cls='swim';letter='🏊';}
    if(doneDays.has(s.workout))cls='done';
    if(isToday)cls+=' today';
    return`<div class="week-day"><div class="wd-label">${s.label}</div><div class="wd-dot ${cls}">${cls.includes('done')?'✓':letter}</div></div>`;
  }).join('');
}
function renderDayCards(){
  const today=new Date().getDay();const hist=getHistory();const doneDays=new Set(hist.map(h=>h.workoutId));
  document.getElementById('day-cards').innerHTML=WORKOUTS.map(w=>{
    const isToday=DAY_SCHEDULE[today]?.workout===w.id;const isDone=doneDays.has(w.id);
    return`<div class="day-card ${isToday?'today-card':''}" onclick="startWorkout('${w.id}')">
      <div class="dc-top"><div class="dc-day">${w.day.toUpperCase()}</div><div class="dc-badge ${w.badge}">${w.type.toUpperCase()}</div></div>
      <div class="dc-name">${w.type}</div><div class="dc-sub">${w.muscles.slice(0,4).join(' · ')}</div>
      <div class="dc-footer"><div class="dc-stats">
        <div class="dc-stat"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>${w.duration}</div>
        <div class="dc-stat"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>${w.reps}</div>
      </div>${isDone?'<div class="dc-done-tag">✓ feito esta semana</div>':(isToday?'<div class="dc-done-tag" style="color:var(--amber)">● hoje</div>':'')}</div>
    </div>`;
  }).join('');
}
function renderStatsHome(){
  const hist=getHistory();const tw=hist.filter(h=>{const d=new Date(h.date);const now=new Date();const sow=new Date(now);sow.setDate(now.getDate()-now.getDay());sow.setHours(0,0,0,0);return d>=sow;});
  document.getElementById('stats-row').innerHTML=`
    <div class="stat-card"><div class="stat-n" style="color:var(--blue)">${tw.length}</div><div class="stat-l">treinos esta semana</div></div>
    <div class="stat-card"><div class="stat-n" style="color:var(--green)">${hist.length}</div><div class="stat-l">treinos no total</div></div>`;
}

function startWorkout(id){
  currentWorkout=WORKOUTS.find(w=>w.id===id);doneBlocks=new Set();

  renderBlocks();updateProgress();
  document.getElementById('finish-btn').style.display='none';
  document.getElementById('finish-early-btn').style.display='block';
  switchTab('workout');
}

function renderBlocks(){
  const list=document.getElementById('blocks-list');if(!currentWorkout)return;
  list.innerHTML=currentWorkout.blocks.map((block,i)=>{
    const numC=nc(block.type);
    const tagHtml=block.tag==='super'?'<span class="super-label">SUPERSET</span>':block.tag==='drop'?'<span class="drop-label">DROPSET</span>':block.tag==='opt'?'<span class="opt-label">OPCIONAL</span>':block.tag==='solo'?'<span class="solo-label">SOLO</span>':'';
    const showPeso=!['warmup','cool'].includes(block.type);
    const exHtml=block.exercises.map(ex=>{
      const last=getLastW(currentWorkout.id,block.id,ex.n);
      const timerBtn=ex.ts?`<button class="ex-timer-btn" onclick="startExTimer(${ex.ts},'${ex.n.replace(/'/g,'')}',event)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>Iniciar ${ex.ts}s</button>`:'';

function toggleBlock(id){
  const body=document.getElementById('body-'+id);const open=body.classList.contains('open');

function markDone(id){
  doneBlocks.add(id);

  document.getElementById('check-'+id).classList.add('checked');
  document.getElementById('body-'+id).classList.remove('open');

  if(idx<blocks.length-1){
    const nid=blocks[idx+1].id;
    document.getElementById('block-'+nid).classList.add('current');
    document.getElementById('body-'+nid).classList.add('open');
    document.getElementById('block-'+nid).scrollIntoView({behavior:'smooth',block:'start'});

function toggleDone(id,e){

function startRestTimer(seconds,blockId,e,customLabel,isEx){
  if(e)e.stopPropagation();

  document.getElementById('timer-label').textContent=customLabel||(isEx?'EXERCÍCIO':'DESCANSO');

      clearInterval(timerInterval);

      if('vibrate' in navigator)navigator.vibrate([200,100,200,100,200]);
      if(isEx)playExEnd();else playRestEnd();

}

function getFilteredExercises(){
  const typeMap={seg:'Força',qua:'Hipertrofia',sex:'Metabólico'};
  let exercises=[];
  WORKOUTS.forEach(w=>{
    if(evoFilter!=='all'&&typeMap[w.id]!==evoFilter)return;
    w.blocks.forEach(b=>{
      if(['warmup','cool'].includes(b.type))return;
      b.exercises.forEach(ex=>{
        exercises.push({wid:w.id,bid:b.id,name:ex.n,wtype:typeMap[w.id],wday:w.shortDay});
      });
    });
  });
  return exercises;
}
function getFilteredEntries(wid,bid,name){
  const all=getAllWeights();
  const k=wKey(wid,bid,name);
  const entries=all[k]||[];
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-evoPeriod);
  return entries.filter(e=>evoPeriod===999||new Date(e.date)>=cutoff);
}
function renderEvo(){
  // filters
  const filters=[{id:'all',label:'Todos',cls:'f-all'},{id:'Força',label:'Força',cls:'f-forca'},{id:'Hipertrofia',label:'Hipertrofia',cls:'f-hiper'},{id:'Metabólico',label:'Metabólico',cls:'f-meta'}];
  document.getElementById('evo-filter').innerHTML=filters.map(f=>`<button class="filter-btn ${f.cls}${evoFilter===f.id?' active':''}" onclick="setEvoFilter('${f.id}')">${f.label}</button>`).join('');
  const periods=[{v:14,l:'2 sem'},{v:30,l:'1 mês'},{v:90,l:'3 meses'},{v:999,l:'Tudo'}];
  document.getElementById('evo-period').innerHTML=periods.map(p=>`<button class="period-btn${evoPeriod===p.v?' active':''}" onclick="setEvoPeriod(${p.v})">${p.l}</button>`).join('');
  // charts
  const exs=getFilteredExercises();
  const container=document.getElementById('evo-charts');
  let html='';let hasData=false;
  exs.forEach((ex,idx)=>{
    const entries=getFilteredEntries(ex.wid,ex.bid,ex.name);
    if(entries.length<1)return;
    hasData=true;
    const first=entries[0].peso;const last=entries[entries.length-1].peso;
    const diff=last-first;const diffStr=diff>0?`+${diff.toFixed(1)}kg`:diff<0?`${diff.toFixed(1)}kg`:'=';
    const diffCls=diff>0?'delta-up':diff<0?'delta-down':'delta-eq';
    const shortName=ex.name.length>40?ex.name.substring(0,38)+'…':ex.name;
    html+=`<div class="chart-card">
      <div class="chart-title">${shortName}</div>
      <div class="chart-sub">${ex.wday} · ${ex.wtype} · ${entries.length} registro${entries.length>1?'s':''}</div>
      <div class="chart-canvas-wrap"><canvas class="chart-cv" id="cv-${idx}" width="400" height="120"></canvas></div>
      <div class="chart-delta ${diffCls}">${entries.length>1?`Variação: ${diffStr} (${first}→${last}kg)`:`Último: ${last}kg`}</div>
    </div>`;
  });
  if(!hasData)html='<div class="evo-empty">Nenhum peso registrado ainda.<br>Complete uma sessão e salve os pesos<br>para ver sua evolução aqui.</div>';
  container.innerHTML=html;
  if(hasData)requestAnimationFrame(()=>{
    exs.forEach((ex,idx)=>{
      const entries=getFilteredEntries(ex.wid,ex.bid,ex.name);
      if(entries.length<1)return;
      const cv=document.getElementById('cv-'+idx);if(!cv)return;
      drawChart(cv,entries,CHART_COLORS[idx%CHART_COLORS.length]);
    });
  });
}
function drawChart(canvas,entries,color){
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth||340;const H=120;
  canvas.width=W*window.devicePixelRatio;canvas.height=H*window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  const vals=entries.map(e=>e.peso);
  const minV=Math.min(...vals)*0.95;const maxV=Math.max(...vals)*1.05;
  const pad={t:10,r:10,b:24,l:36};
  const cW=W-pad.l-pad.r;const cH=H-pad.t-pad.b;
  // bg
  ctx.fillStyle='transparent';ctx.fillRect(0,0,W,H);
  // grid lines
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad.t+cH*(1-i/4);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();}
  // y labels
  ctx.fillStyle='#555';ctx.font=`${9*window.devicePixelRatio/window.devicePixelRatio}px DM Mono, monospace`;ctx.textAlign='right';
  for(let i=0;i<=4;i++){const v=minV+(maxV-minV)*i/4;const y=pad.t+cH*(1-i/4);ctx.fillText(v.toFixed(1),pad.l-4,y+3);}
  // x labels
  ctx.textAlign='center';ctx.fillStyle='#555';
  if(entries.length>1){
    const step=Math.max(1,Math.floor(entries.length/4));
    for(let i=0;i<entries.length;i+=step){
      const x=pad.l+cW*i/(entries.length-1);const d=new Date(entries[i].date);
      ctx.fillText(`${d.getDate()}/${d.getMonth()+1}`,x,H-6);
    }
  }
  // gradient fill
  if(entries.length>1){
    const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);
    grad.addColorStop(0,color+'44');grad.addColorStop(1,color+'00');
    ctx.beginPath();
    entries.forEach((e,i)=>{const x=pad.l+cW*i/(entries.length-1);const y=pad.t+cH*(1-(e.peso-minV)/(maxV-minV));i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.lineTo(pad.l+cW,pad.t+cH);ctx.lineTo(pad.l,pad.t+cH);ctx.closePath();
    ctx.fillStyle=grad;ctx.fill();
  }
  // line
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';
  entries.forEach((e,i)=>{const x=pad.l+cW*i/(Math.max(entries.length-1,1));const y=pad.t+cH*(1-(e.peso-minV)/(maxV-minV));i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.stroke();
  // dots
  entries.forEach((e,i)=>{
    const x=pad.l+cW*i/(Math.max(entries.length-1,1));const y=pad.t+cH*(1-(e.peso-minV)/(maxV-minV));
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fillStyle='#0a0a0a';ctx.fill();
  });
}

// ── RELATÓRIO ─────────────────────────────────────────────────────────────────
function buildReportData(){
  const all=getAllWeights();const hist=getHistory();
  const tables=[];
  WORKOUTS.forEach(w=>{
    const rows=[];
    w.blocks.forEach(b=>{
      if(['warmup','cool'].includes(b.type))return;
      b.exercises.forEach(ex=>{
        const k=wKey(w.id,b.id,ex.n);const entries=all[k]||[];
        if(!entries.length)return;
        const first=entries[0];const last=entries[entries.length-1];
        const diff=last.peso-first.peso;
        rows.push({name:ex.n,registros:entries.length,inicio:first.peso,atual:last.peso,variacao:diff,dataInicio:new Date(first.date).toLocaleDateString('pt-BR'),dataAtual:new Date(last.date).toLocaleDateString('pt-BR')});
      });
    });
    if(rows.length)tables.push({workout:w.type,day:w.day,rows});
  });
  return{tables,hist,generated:new Date().toLocaleString('pt-BR')};
}
function renderRelPreview(){
  const data=buildReportData();

  if(!data.tables.length){html='<div style="padding:20px;color:var(--text3);font-size:13px;text-align:center">Nenhum dado ainda. Registre pesos durante os treinos.</div>';document.getElementById('rel-preview').innerHTML=html;return;}

    html+=`<div class="rel-card"><div class="rel-card-title"><span>${t.workout} — ${t.day}</span></div>

  });
  document.getElementById('rel-preview').innerHTML=html;
}

  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const nav=document.querySelector('.bottom-nav');nav.style.display='flex';
  if(tab==='home'){document.getElementById('screen-home').classList.add('active');document.getElementById('nav-home').classList.add('active');}
  else if(tab==='evo'){document.getElementById('screen-evo').classList.add('active');document.getElementById('nav-evo').classList.add('active');renderEvo();}
  else if(tab==='history'){document.getElementById('screen-history').classList.add('active');document.getElementById('nav-history').classList.add('active');renderHistory();}
  else if(tab==='rel'){document.getElementById('screen-rel').classList.add('active');document.getElementById('nav-rel').classList.add('active');renderRelPreview();}
  else if(tab==='workout'){document.getElementById('screen-workout').classList.add('active');nav.style.display='none';window.scrollTo(0,0);}
}
init();
</script>
</body>
</html>
